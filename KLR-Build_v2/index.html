    <!--
      Fonts are self-hosted latin subsets (SIL OFL) in public/fonts so there is
      no render-blocking third-party stylesheet and no extra DNS/TLS on the
      critical path. Only the two faces visible above the fold are preloaded.
      The klr:hero-preload comment below is replaced at build time by
      vite.config.ts with a preload for the hero <picture> so the LCP image is
      discovered from the HTML, not after the JS bundle runs.
    -->
    <link rel="preload" href="/fonts/archivo-500-900-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/work-sans-400-600-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- klr:hero-preload -->
    <style>
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 500 900;
        font-display: swap;
        src: url("/fonts/archivo-500-900-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

        font-family: "Work Sans";

        font-weight: 400 600;

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

      @font-face {

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
