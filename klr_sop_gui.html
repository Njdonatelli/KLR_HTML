ect from Design/Sales to Production with **zero information loss**, so Production schedules and builds exactly what was sold and designed. Kills the design-build failure mode where the crew re-discovers or drifts from the sold scope.\n\n## Scope / Trigger\nFires on CON-001 cleared funds. Covers the handoff review, package verification, constructability scan, permit/HOA gate mapping, and opening the production project structure. Ends when the Contractor Foreman production project exists and PRO-002 is triggered.\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead\n- **Accountable:** Production Lead\n- **Consulted:** Design Lead (scope/plans walkthrough), Operations Manager (permit/HOA/contract status)\n- **Informed:** Principal (feasibility conflicts), Client (start expectations + POC)\n\n## Systems & Inputs\n- **Contractor Foreman** — production project structure.\n- **Dropbox** — production subfolder per TEC-002.\n- **Handoff package:** executed contract + locked scope (CON-001), plans/renderings (DES-004), takeoff/estimate (DES-005), site + drainage data + photos (DES-001), HOA status (CON-002), permit status (CON-003), milestone schedule (FIN-001), client priorities + access/staging notes, internal margin target.\n\n## Procedure\n1. **Receive handoff** — Production Lead gets the CON-001 handoff notice in Contractor Foreman. → *Output: handoff opened.*\n2. **Handoff review meeting** — Design Lead walks Production through scope, plans, allowances, site constraints, drainage strategy, and client priorities. → *Output: logged handoff review.*\n3. **Verify package** against the handoff checklist; **bounce gaps back** to Design/Ops — do not proceed on assumptions. → *Output: verified handoff package.*\n4. **Constructability scan** — flag anything unbuildable-as-drawn, sub requirements, and long-lead materials. → *Output: feasibility flags (→ CON-004 if scope must change).*\n5. **Map gating** — identify permit-gated (CON-003) and HOA-gated (CON-002) scope vs. scope that can **start now** (non-gated site work — the flyer's \"construction starts while… finalized\"). → *Output: start-now vs. gated map.*\n6. **Set client comms** — confirm primary POC and update cadence; set start expectations. → *Output: comms plan.*\n7. **Open production structure** — create phases/tasks in Contractor Foreman + Dropbox production subfolder. → *Output: production-ready project → triggers PRO-002 + PRO-003.*\n\n## Acceptance Criteria / QC\n**Production never starts re-discovering scope that was already sold and designed.** Concretely:\n- Handoff package complete + verified against checklist.\n- Handoff review meeting held and logged.\n- Constructability scan complete; flags routed.\n- Permit/HOA gating mapped (start-now vs. gated scope explicit).\n- Client POC + cadence set.\n- Contractor Foreman production project + Dropbox subfolder created.\n\n## Exceptions & Escalation\n- **Package gaps** → return to Design/Ops; no proceeding on assumptions.\n- **Sold scope conflicts with buildable reality** → CON-004 or Principal + Design Lead.\n- **Permit not yet issued** → start only non-permit site work; gated scope waits.\n- **Margin at risk from a feasibility issue** → Principal.\n\n## Outputs\nVerified handoff package, feasibility flags, Contractor Foreman production project → triggers **PRO-002** (scheduling) and **PRO-003** (materials).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Production Lead | Initial. Verified-handoff gate (sold = built); constructability scan; permit/HOA start-now vs. gated mapping. |\n", "PRO-002": "# SOP-PRO-002 · Scheduling & Crew Allocation\n\n| Field | Value |\n|-------|-------|\n| Owner | Production Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | PRO-001, PRO-003, PRO-004, PRO-005, CON-002, CON-003, FIN-001, FLD-002, SAF-002 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nProduce and maintain a realistic, dependency-aware schedule with crew/sub assignments that respects permit/HOA gates, material lead times, and inspection hold points — and keeps every active project current on a weekly cadence.\n\n## Scope / Trigger\nTwo layers: **(a) per-project** schedule build on PRO-001 trigger; **(b) weekly cross-project** look-ahead + crew allocation. Ends only when a project reaches closeout (PRO-006) — the weekly layer is continuous.\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead\n- **Accountable:** Production Lead\n- **Consulted:** Subs (availability, PRO-004), Operations Manager (client-milestone commitments)\n- **Informed:** Crew, Client (published milestones)\n\n## Systems & Inputs\n- **Contractor Foreman** — schedule + crew/sub allocation.\n- Handoff + gating map (PRO-001), materials delivery calendar (PRO-003), daily actuals (PRO-005), billing milestones (FIN-001).\n\n## Procedure\n1. **Build phase schedule** from handoff — sequence: site prep/excavation → drainage/grading → base → hardscape → structures/pool coordination → planting/turf/irrigation → cleanup/walkthrough. Set durations; encode dependencies (HOA/permit gates, PRO-003 deliveries, inspection hold points). → *Output: project schedule in CF.*\n2. **Allocate crew + subs** per phase against capacity; issue sub schedule requests (PRO-004) with lead time. → *Output: resourced schedule.*\n3. **Insert gates + buffers** — no gated phase before its approval (CON-002/003); weather buffer on concrete/drainage phases. → *Output: gated schedule.*\n4. **Publish client milestones** (start, key phases, est. completion) aligned to FIN-001 billing milestones. → *Output: client-facing schedule.*\n5. **Weekly look-ahead** [**each Monday**] — review all active projects, reconcile actual vs. planned from PRO-005 logs, reallocate crew, flag slippage, update client milestones on any material/gate change. → *Output: updated weekly schedule.*\n\n## Acceptance Criteria / QC\n**No phase is scheduled before its gate (permit / HOA / material) clears.** Concretely:\n- Every active project has a current CF schedule with dependencies + gates encoded.\n- Crew/subs allocated within capacity; sub lead time honored.\n- Client milestones published and kept current.\n- Weekly look-ahead performed and logged.\n\n## Exceptions & Escalation\n- **Material delay** → reschedule dependent phases (coordinate PRO-003), notify client.\n- **Crew over-allocation** → Production Lead reprioritizes; Principal if capacity structurally short.\n- **Inspection failure** → hold affected phase + reschedule (SAF).\n- **Gate slippage threatening a committed client milestone** → Operations Manager + client comms.\n\n## Outputs\nProject + weekly schedules, sub requests, published client milestones → Contractor Foreman. Drives **PRO-003** (delivery timing), **PRO-004** (subs), and field execution (**FLD**).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Production Lead | Initial. Gate-aware phase scheduling (permit/HOA/material) + weather buffers; weekly cross-project look-ahead reconciled against PRO-005 actuals. |\n", "PRO-003": "# SOP-PRO-003 · Materials Timeline & Delivery Coordination\n\n| Field | Value |\n|-------|-------|\n| Owner | Production Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | PRO-001, PRO-002, DES-005, PRC-001, PRC-002, PRC-003, PRC-004, CON-004, FIN-003 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nOrder materials against the takeoff (DES-005) with timing tied to the schedule (PRO-002) so each phase has what it needs when the crew arrives — **no idle crews waiting on materials, nothing perishable delivered early**. Delivers the flyer's \"materials arrive and installation begins.\"\n\n## Scope / Trigger\nFires on PRO-001 trigger; runs in lockstep with PRO-002 through the build. Covers materials planning, lead-time classification, PO placement, delivery timing/staging, and delay propagation. Ends when the last phase's materials are received. Ordering mechanics live in PRC-002; supplier list in PRC-001.\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead\n- **Accountable:** Production Lead\n- **Consulted:** Operations Manager (PO approvals per PRC-002), Client (plant selection, PRC-003)\n- **Informed:** Crew (delivery windows), Design Lead (substitutions affecting design)\n\n## Systems & Inputs\n- **Contractor Foreman** — materials list, POs, delivery calendar.\n- Takeoff (DES-005), schedule (PRO-002), approved suppliers (PRC-001 — SiteOne hardscape/irrigation, nurseries), site access/staging notes (DES-001).\n\n## Procedure\n1. **Build materials list** from the takeoff (DES-005); classify each item **stock / special-order / long-lead**. **No ad-hoc ordering** outside the takeoff. → *Output: materials plan.*\n2. **Map delivery dates** — for each item, work backward from its required-on-site phase date (PRO-002) by lead time + **[buffer]**. → *Output: delivery calendar.*\n3. **Place POs** via PRC-002 against approved suppliers (PRC-001); **order long-lead items immediately** (flagged at PRO-001). → *Output: issued POs.*\n4. **Coordinate windows + staging** against site access/logistics (DES-001); schedule **perishables (plants) close to install**, not early. → *Output: scheduled deliveries.*\n5. **Track + resolve** — monitor order status; on backorder/substitution, resolve (alt supplier via PRC-001 / substitution) and propagate to PRO-002 (reschedule) and CON-004 (if scope/cost changes). → *Output: order tracker.*\n6. **Receive + inspect** per PRC-004; log and resolve over/short/damage against the PO. → *Output: verified materials on site.*\n\n## Acceptance Criteria / QC\n**Every phase has its materials on site before the crew arrives; nothing perishable arrives early.** Concretely:\n- Materials plan derived from the takeoff (no ad-hoc orders).\n- Long-lead items ordered at kickoff.\n- Each delivery mapped to its phase date with buffer.\n- Perishables timed to install.\n- Deliveries received + inspected against PO (PRC-004).\n- Delays propagated to schedule (PRO-002) + client.\n\n## Exceptions & Escalation\n- **Long-lead item threatens start** → resequence phases (PRO-002) or substitute (CON-004).\n- **Backorder** → alternate approved supplier (PRC-001).\n- **Over/short/damaged delivery** → PRC-004 resolution against PO.\n- **Delay threatening a committed milestone** → Operations Manager + client; reorder price change → CON-004 / FIN-003.\n\n## Outputs\nMaterials plan, delivery calendar, POs, order tracker → Contractor Foreman + Dropbox. Enables **FLD** phases; feeds **PRO-002** updates and **FIN-003** job costing.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Production Lead | Initial. Takeoff-derived JIT materials plan tied to schedule; long-lead ordered at kickoff; perishables timed to install; delay propagation to PRO-002/CON-004. |\n", "PRO-006": "# SOP-PRO-006 · Project Closeout & Punch List\n\n| Field | Value |\n|-------|-------|\n| Owner | Production Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | PRO-002, PRO-005, FLD-002, FLD-003, FLD-006, CON-001, CON-004, CX-001, FIN-001, FIN-003 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nVerify all contracted + change-order scope is complete to spec, generate and clear the **internal** punch list, and package the project for client sign-off — so the client walk-through (CX-001) is a confirmation, never a discovery of work KLR should have caught.\n\n## Scope / Trigger\nFires when production phases complete (PRO-002). Covers internal completion review, punch generation/clearance, QC-record verification, cleanup/demobilization, and closeout-package assembly. Ends by triggering CX-001. Does **not** cover the client walk or sign-off (CX-001).\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead\n- **Accountable:** Production Lead\n- **Consulted:** Crew lead (punch resolution), Design Lead (design-intent questions)\n- **Informed:** Operations Manager (CX-001 readiness), Admin/Finance (final billing readiness, FIN-001)\n\n## Systems & Inputs\n- **Contractor Foreman** — punch list, completion status.\n- **Dropbox** — closeout package per TEC-002.\n- Contracted scope (CON-001) + change orders (CON-004), plans (DES-004), FLD QC records (FLD-002/003), daily logs (PRO-005).\n\n## Procedure\n1. **Internal completion review** — verify all contracted + CO scope against plans (DES-004). → *Output: completion review.*\n2. **Generate internal punch list** — walk with crew lead; capture defects, incomplete items, and cleanup against FLD standards (FLD-002/003 QC). → *Output: internal punch list.*\n3. **Resolve + re-inspect** — assign, complete, and re-check each punch item. → *Output: cleared internal punch.*\n4. **Verify QC records** — confirm FLD-002/003 photo + drainage-test records are complete and filed. → *Output: QC pack.*\n5. **Cleanup + demobilize** — final site cleanup and equipment removal; confirm jobsite condition (FLD-006). → *Output: clean site.*\n6. **Assemble closeout package** for CX-001 — as-builts/photos, warranty docs, QC records, final SOV status (FIN-001). → *Output: closeout package → triggers CX-001.*\n\n## Acceptance Criteria / QC\n**The client walk-through (CX-001) confirms completion — it never discovers open work KLR should have caught.** Concretely:\n- Internal completion review done against contracted + CO scope.\n- Internal punch generated **and cleared** before the client walk.\n- FLD QC records complete and filed.\n- Site cleaned and demobilized.\n- Closeout package assembled and CX-001 triggered.\n\n## Exceptions & Escalation\n- **Unresolvable item** (e.g., material backorder) → document + client-agreed carry to warranty (CX-002) or return visit; do not hide it.\n- **Scope gap vs. contract** → correct, or CON-004 if it's a change.\n- **Quality below standard requiring rework** → Production Lead owns; margin impact → Principal.\n\n## Outputs\nCleared internal punch, QC pack, closeout package → Dropbox + Contractor Foreman. Triggers **CX-001**; final costs → **FIN-003**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Production Lead | Initial. Internal-punch-cleared-before-client-walk gate; FLD QC-record verification; closeout package assembly triggering CX-001. |\n", "SAF-004": "# SOP-SAF-004 · Incident Reporting & Insurance Claims\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | SAF-001, SAF-002, SAF-005, HR-004 |\n\n> Bracketed values `[…]` are proposed defaults. **Not legal advice** — Cal/OSHA and workers'-comp reporting deadlines below must be verified with counsel / broker before Effective date.\n\n## Purpose\nEnsure every jobsite incident — injury, property damage, or near-miss — is responded to, documented, and reported to insurance and authorities correctly and **within statutory deadlines** — protecting people, limiting liability, and preserving coverage/claim rights.\n\n## Scope / Trigger\nFires on any incident: worker injury, third-party/property damage, vehicle incident, or near-miss. Covers immediate response through claim closure and corrective action.\n\n## Roles (RACI-lite)\n- **Responsible:** On-site crew lead (immediate) → Operations Manager (reporting/claim)\n- **Accountable:** Operations Manager\n- **Consulted:** Insurance broker, counsel (serious incidents), Principal\n- **Informed:** Affected worker, Admin/Finance\n\n## Systems & Inputs\n- **Dropbox** — incident records + claim docs (TEC-002).\n- Incident form; insurance policies (SAF-005); emergency contacts.\n\n## Procedure\n1. **Immediate response** — secure the scene, render/summon medical aid, make the area safe. Life-safety first. → *Output: scene safe.*\n2. **Internal report same-day** to Operations Manager / Principal. → *Output: internal report.*\n3. **Document** — incident form: who/what/when/where, witnesses, photos, conditions. → *Output: incident record.*\n4. **Notify within deadlines** — insurer per policy; **workers' comp per CA employer timeline**; **Cal/OSHA for serious injury/fatality within the required window [verify current deadlines]**. → *Output: notifications logged.*\n5. **Manage the claim** — single point of contact; preserve evidence; cooperate with insurer/investigators. → *Output: claim managed.*\n6. **Corrective action** — root-cause; update SAF-001/002 if systemic. → *Output: corrective action logged.*\n\n## Acceptance Criteria / QC\n**Every incident is documented same-day and reported within statutory/policy deadlines — no exceptions.** Concretely:\n- Scene secured; medical rendered where needed.\n- Incident documented same-day (form + photos + witnesses).\n- Insurer + required authorities notified within deadlines.\n- Claim managed to closure with evidence preserved.\n- Corrective action logged; source SOPs updated if systemic.\n\n## Exceptions & Escalation\n- **Serious injury / fatality** → immediate Principal + counsel + Cal/OSHA per mandatory reporting window (verify); do not disturb scene beyond making safe.\n- **Disputed liability / third-party claim** → counsel before statements.\n\n## Outputs\nIncident record, notifications, claim file, corrective action → Dropbox. Feeds **SAF-001/002** (prevention) and interacts with **SAF-005** (coverage) / **HR-004** (worker status).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial. Life-safety-first response; same-day documentation; deadline-bound insurer/Cal-OSHA/workers'-comp notification (verify timelines); root-cause corrective loop. |\n", "SAF-005": "# SOP-SAF-005 · Licensing & Insurance Currency (CSLB)\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | CON-001, PRO-004, SAF-004, HR-004 |\n\n> Bracketed values `[…]` are proposed defaults. **Not legal advice** — CSLB / insurance requirements below must be verified with counsel / broker / CSLB before Effective date.\n\n## Purpose\nKeep the CSLB license, contractor bond, insurance (general liability, workers' comp), and required registrations **current and verifiable**, so KLR can legally contract and is never exposed to a lapse that voids a contract or coverage.\n\n## Scope / Trigger\nStanding SOP, **quarterly** review plus event triggers (pre-contract, pre-sub-scheduling). Covers KLR's own credentials and subcontractor credential verification.\n\n## Roles (RACI-lite)\n- **Responsible:** Operations Manager\n- **Accountable:** Principal\n- **Consulted:** Insurance broker, counsel (coverage/requirements)\n- **Informed:** Admin/Finance, Production Lead (sub scheduling)\n\n## Systems & Inputs\n- **Dropbox** — compliance register + certificates (`02_Areas/`, TEC-002).\n- CSLB license record; bond; GL + workers' comp policies; business license; fleet/auto insurance; sub COIs + licenses.\n\n## Compliance register (maintain currency + expiry)\n| Credential | Note (verify) |\n|-----------|---------------|\n| CSLB license | Renewal cycle (typically 2 yrs); # appears on all contracts (CON-001) |\n| Contractor bond | Current, correct amount |\n| Workers' comp | Required with employees (HR-004) |\n| General liability | Current; adequate limits |\n| Business license | Local, current |\n| Fleet/auto | Current for company vehicles |\n| Subcontractor COI + license | Per active sub (PRO-004) |\n\n## Procedure\n1. **Maintain the register** — credential #, carrier, limits, expiry for every item above. → *Output: compliance register.*\n2. **Quarterly review** of all expiries; calendar renewals **[60–90 days]** ahead. → *Output: review + renewal calendar.*\n3. **Verify before contracting** — confirm license + insurance current before any CON-001 signature (license # on the contract). → *Output: pre-contract check.*\n4. **Verify subs** — collect + track each sub's license + COI; **do not schedule an uninsured/unlicensed sub** (PRO-004). → *Output: sub compliance log.*\n5. **Renew + file** — process renewals; file current certificates/COIs in Dropbox. → *Output: filed current docs.*\n\n## Acceptance Criteria / QC\n**KLR never contracts, and no sub works, under a lapsed license or insurance.** Concretely:\n- All own credentials current and documented.\n- Quarterly review performed; renewals calendared ahead of expiry.\n- Pre-contract license/insurance check passed for every signed job.\n- Every scheduled sub has a current license + COI on file.\n\n## Exceptions & Escalation\n- **Approaching lapse with renewal at risk** → Principal + broker immediately; hold new contracts if a required credential would be lapsed at signing.\n- **Sub cannot produce current COI/license** → do not schedule; Production Lead sources an alternative.\n\n## Outputs\nCurrent compliance register + filed certificates → Dropbox. Gates **CON-001** (signing) and **PRO-004** (sub scheduling); supports **SAF-004** claims and **HR-004** classification.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial. Compliance register + quarterly review; pre-contract and pre-sub verification gates; no contracting/sub work under lapsed credentials. CSLB/insurance specifics flagged for verification. |\n", "SAL-002": "# SOP-SAL-002 · Lead Intake & Qualification\n\n| Field | Value |\n|-------|-------|\n| Owner | Sales Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | SAL-001, SAL-003, SAL-004, SAL-005, CX-002, TEC-009 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nConvert every raw inbound signal, from any channel, into a single normalized SalesRabbit lead record, qualified against a fixed rubric, and dispositioned to exactly one next step. Guarantees no lead is lost, worked twice, or advanced unqualified.\n\n## Scope / Trigger\nFires on any new lead signal:\n- **Canvass** — rep-created in SalesRabbit (SAL-001).\n- **Email** — M365 shared mailbox (the `klrbuildllc@gmail.com` forward; per framework §0 the shared mailbox is canonical, Gmail is never worked directly).\n- **Phone / text** — (619) 739-1135.\n- **Web** — klrbuild.com form.\n- **Referral** — partner or past client.\n\nDoes **not** cover warranty/existing-client requests (→ CX-002) or commercial/non-residential inquiries (→ escalate, out of standard scope).\n\n## Roles (RACI-lite)\n- **Responsible:** Sales Lead (or intake-duty rep)\n- **Accountable:** Sales Lead\n- **Consulted:** Design Lead (scope-fit edge cases)\n- **Informed:** Operations Manager (pipeline reporting)\n\n## Systems & Inputs\n- **SalesRabbit** — CRM of record.\n- **M365 shared mailbox** — canonical email intake.\n- Inbound signal with at minimum a contact method and a property reference.\n\n## Procedure\n1. **Capture** the lead into SalesRabbit within **[1 business hour]** of receipt (speed-to-lead), regardless of channel. Tag **Lead Source** on creation. → *Output: SalesRabbit lead record, source-tagged.*\n2. **Deduplicate** against existing records by property address + name/phone. If dupe, merge — never create parallel records. → *Output: single canonical record.*\n3. **Verify contact + property:** confirm property address, **ownership** (owner or owner-authorized), and HOA presence.\n4. **Run qualification rubric** (below).\n5. **Disposition** to one outcome:\n   - **Qualified** → hand to SAL-003 (appointment setting).\n   - **Nurture** → tag + place on follow-up cadence (soft timeline / undecided budget).\n   - **Disqualified** → close with a **reason code** (out-of-area, renter, out-of-scope, no budget, unresponsive ×[3]).\n6. **Complete required fields** for pipeline hygiene (feeds SAL-004) and clear the source signal — shared-mailbox item filed/flagged so nothing sits unworked.\n\n### Qualification Rubric\n**Hard gates (all must pass to qualify):**\n- Project type in scope — patio/hardscape, pool/spa, four-season room, water feature/firepit, turf/planting/irrigation.\n- Property owner (or authorized) — not a renter acting alone.\n- Within service area — **[North County San Diego / ~25-mi Oceanside radius]**.\n\n**Soft signals (weigh; weak signals → Nurture, not Disqualify):**\n- Budget realism vs. project type (design-build has a practical floor).\n- Timeline — ready within **[6 months]** vs. \"just looking.\"\n- Decision-makers identifiable/available for the consult.\n- Motivation/trigger event (moving in, damage, event deadline).\n\nHOA presence is **not** disqualifying — it's a process flag carried to CON-002.\n\n## Acceptance Criteria / QC\n- Every inbound signal is a SalesRabbit record within **[1 business hour]**.\n- Lead Source tagged; no duplicate records for one property.\n- Ownership + service-area confirmed before Qualified.\n- Disposition set with reason code; zero leads in \"new\" state older than **[24 h]**.\n- Shared-mailbox intake at **zero unworked** at end of each business day.\n\n## Exceptions & Escalation\n- **Out-of-area but high-value / referral** → Sales Lead discretion, log override reason.\n- **Commercial / non-residential** → Principal (out of standard residential scope).\n- **Warranty or existing-client** misrouted here → reassign to CX-002.\n- **Ambiguous scope fit** → consult Design Lead before dispositioning.\n\n## Outputs\n- Qualified lead → **SAL-003**.\n- Clean, source-tagged, dispositioned SalesRabbit record → **SAL-004** (hygiene) and **SAL-001** (territory/source feedback).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Sales Lead | Initial. Multi-channel intake normalized to SalesRabbit; hard-gate + soft-signal rubric; M365 shared mailbox as canonical email intake. |\n", "SAL-003": "# SOP-SAL-003 · Appointment Setting & Confirmation\n\n| Field | Value |\n|-------|-------|\n| Owner | Sales Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | SAL-002, SAL-004, SAL-005, DES-001, TEC-009, TEC-003, TEC-007 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nConvert a qualified lead into a **booked, confirmed consultation** on the Design Lead's calendar with decision-makers committed and context attached — minimizing no-shows and giving DES-001 everything it needs before the visit.\n\n## Scope / Trigger\nFires when SAL-002 marks a lead **Qualified**. Covers booking, calendaring, attendance confirmation, reminder cadence, and reschedules. Ends when a confirmed consult with attached context is ready for SAL-005 / DES-001.\n\n## Roles (RACI-lite)\n- **Responsible:** Sales Lead (or intake-duty rep)\n- **Accountable:** Sales Lead\n- **Consulted:** Design Lead (availability)\n- **Informed:** Client, Operations Manager\n\n## Systems & Inputs\n- **M365 calendar** — canonical scheduling (framework §0).\n- **SalesRabbit** — lead record + stage.\n- **Zapier / n8n** — confirmation + reminder automation (platform per §TEC routing principle).\n- Qualified lead + notes (SAL-002).\n\n## Procedure\n1. **Contact to book** within **[1 business hour]** of qualification; offer Design Lead availability pulled from the M365 calendar. → *Output: booked slot.*\n2. **Create the consult event** on the M365 calendar with lead context attached (SalesRabbit link, qualification notes, address, access notes). → *Output: calendar event.*\n3. **Confirm decision-makers** will attend (per the SAL-002 soft signal). → *Output: attendance confirmed.*\n4. **Set confirmation cadence** via automation — booking confirm now, **[24 h]** reminder, day-of reminder. → *Output: reminder cadence active.*\n5. **Handle reschedule/cancel** — rebook, update the event + SalesRabbit; after **[2]** no-shows, disposition per SAL-002 (nurture/DQ). → *Output: updated record.*\n6. **Pre-consult handoff** — ensure the Design Lead has context before the visit (feeds DES-001 pre-visit prep). → *Output: consult-ready.*\n\n## Acceptance Criteria / QC\n**No consult is booked without decision-makers confirmed and context attached.** Concretely:\n- Qualified lead contacted within [1 business hour].\n- Consult on the M365 calendar with SalesRabbit context attached.\n- Decision-maker attendance confirmed.\n- Confirmation + reminder cadence active.\n- Reschedules/no-shows tracked and dispositioned.\n\n## Exceptions & Escalation\n- **Client unresponsive to booking** → nurture cadence (SAL-002); don't hard-DQ prematurely.\n- **Out-of-area edge case** → Sales Lead discretion.\n- **Repeated no-shows** → disposition; VIP/large project → Design Lead + Operations Manager.\n\n## Outputs\nConfirmed M365 consult + attached context → **SAL-005** / **DES-001**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Sales Lead | Initial. [1-hr] speed-to-book; M365-calendar consult with context; decision-maker confirmation + automated reminder cadence to cut no-shows. |\n", "SAL-005": "# SOP-SAL-005 · Lead → Design Handoff\n\n| Field | Value |\n|-------|-------|\n| Owner | Sales Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | SAL-002, SAL-003, DES-001, DES-005, TEC-001, TEC-003, TEC-007 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nTransfer a converted lead from **SalesRabbit into Contractor Foreman** with complete context and formally assign it to the Design Lead — so DES-001 starts with everything, nothing is re-keyed, and no lead falls in the CRM→PM gap.\n\n## Scope / Trigger\nFires when a lead converts (Qualified + consult booked, SAL-003). Covers system sync, context packaging, assignment, acknowledgment, and pipeline-stage update. Ends when the Design Lead acknowledges an assigned, context-complete Contractor Foreman record. Distinct from the later production handoff (PRO-001).\n\n## Roles (RACI-lite)\n- **Responsible:** Sales Lead\n- **Accountable:** Sales Lead\n- **Consulted:** Geospatial/Tech Manager (automation/sync issues)\n- **Informed:** Design Lead (assignee), Operations Manager\n\n## Systems & Inputs\n- **SalesRabbit** → **Contractor Foreman** (sync, ideally automated via Zapier/n8n per §TEC routing principle).\n- Qualified lead + consult booking (SAL-002/003).\n\n## Procedure\n1. **Trigger on conversion** (SAL-003 booked). → *Output: handoff initiated.*\n2. **Create/sync the CF record** from SalesRabbit — client, address, scope interest, qualification notes, source. Prefer automation; the sync must not require re-keying. → *Output: Contractor Foreman record.*\n3. **Attach context pack** — qualification notes, consult date, access/staging notes, budget band, HOA flag (if known). → *Output: context pack.*\n4. **Assign to Design Lead** and notify with consult details. → *Output: assigned + notified.*\n5. **Confirm acknowledgment** — Design Lead acknowledges receipt; **no silent handoffs**. → *Output: acknowledged.*\n6. **Update SalesRabbit stage** to reflect handoff; maintain a single source of truth per record (no dual-entry drift). → *Output: synced pipeline.*\n\n## Acceptance Criteria / QC\n**Every converted lead reaches the Design Lead with full context and an acknowledgment — nothing falls in the SalesRabbit→CF gap.** Concretely:\n- CF record created with full context (no re-keying).\n- Design Lead assigned and acknowledged.\n- SalesRabbit stage updated.\n- No converted lead un-handed-off past **[24 h]**.\n\n## Exceptions & Escalation\n- **Automation/sync failure** → manual handoff fallback immediately; never drop the lead. Log the failure to TEC-001/003/007.\n- **Duplicate / re-engaged lead** → merge to the canonical record.\n- **Handoff SLA breach** → Sales Lead / Operations Manager.\n\n## Outputs\nContext-complete Contractor Foreman project + Design Lead assignment → **DES-001**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Sales Lead | Initial. SalesRabbit→CF sync (no re-key); context pack + mandatory Design Lead acknowledgment; manual fallback on automation failure. |\n", "TEC-001": "# SOP-TEC-001 · Software Stack Admin & Access Control\n\n| Field | Value |\n|-------|-------|\n| Owner | Geospatial / Tech Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | HR-003, HR-004, TEC-002, TEC-003, TEC-007, TEC-009, TEC-006 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nGovern the app stack — inventory, provisioning, access/permissions, credentials, and offboarding — so every system is least-privilege and role-based, credentials are controlled, and departures never leave open access or orphaned licenses.\n\n## Scope / Trigger\nStanding SOP. Event triggers: hire (provision), role change (adjust), departure (revoke), new tool adoption (inventory), plus **[quarterly]** access review. Covers all stack apps: SalesRabbit, Contractor Foreman, Dropbox, M365, Zapier, n8n, Trello, Zoom.\n\n## Roles (RACI-lite)\n- **Responsible:** Geospatial / Tech Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Domain owners (access needs)\n- **Informed:** Principal, HR (on/offboarding)\n\n## Systems & Inputs\n- **M365 identity** as the primary directory (SSO where supported).\n- **Secrets manager** for credentials; Dropbox (TEC-002) for the inventory/matrix docs.\n\n## Procedure\n1. **System inventory** — app, purpose, license count/cost, admin owner, auth method (prefer M365 SSO). → *Output: stack inventory.*\n2. **Role-based access matrix** — which roles get which apps at which permission level, **least privilege**. → *Output: access matrix.*\n3. **Provision on hire** (HR-003) per the matrix; use M365 identity/SSO where possible. → *Output: provisioned access.*\n4. **Credential governance** — no shared passwords; secrets in a manager; **MFA on all**; automation service accounts (Zapier/n8n, TEC-003/007) inventoried and rotated. → *Output: credential control.*\n5. **Offboard same-day** on departure — revoke all access, reclaim licenses, rotate any shared/automation credentials the person touched. → *Output: clean offboard.*\n6. **[Quarterly] access review** — audit for drift, orphaned accounts, unused licenses. → *Output: access review.*\n\n## Acceptance Criteria / QC\n**Access is least-privilege and role-based; departures revoke all access same-day; no shared or unmanaged credentials exist.** Concretely:\n- Stack inventory current (apps, owners, licenses, auth).\n- Access matrix enforced; least privilege.\n- MFA everywhere; no shared passwords; secrets in a manager.\n- Same-day offboarding revocation + license reclaim.\n- Quarterly access review performed.\n\n## Exceptions & Escalation\n- **Elevated/temporary access** → time-boxed, logged, revoked on expiry.\n- **Access request beyond role** → Operations Manager approval.\n- **Suspected credential compromise** → immediate rotation + affected-automation review (TEC-003/007).\n\n## Outputs\nStack inventory, access matrix, credential controls → Dropbox (TEC-002). Underpins **TEC-003/007** (automation creds), **TEC-009** (M365 access), and HR on/offboarding.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Tech Manager | Initial. Stack inventory + least-privilege role matrix; MFA + secrets-manager credential governance; same-day offboarding; quarterly access review. |\n", "TEC-002": "# SOP-TEC-002 · Dropbox File Structure & Naming (PARA)\n\n| Field | Value |\n|-------|-------|\n| Owner | Geospatial / Tech Manager |\n| Version | v1.1 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | TEC-001, TEC-003, TEC-004, TEC-006, DES-004, DES-005, CON-001, CON-002, PRO-005, CX-001, PRO-006 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nDefine and maintain the canonical Dropbox structure and naming so **every SOP's file references resolve to exactly one location**, projects are findable, and the LLM knowledge base (TEC-004) indexes cleanly. This is the substrate the entire SOP system writes to — hence P1.\n\nv1.1 changes the *form* of a canonical reference: a location is identified by its **Dropbox folder ID**, not by its display path. Paths were rewritten three times in eight months and every rewrite silently broke every document that quoted one. IDs do not move.\n\n## Scope / Trigger\nStanding SOP. Governs root structure, per-project folder template, naming conventions, ID registration, access provisioning, and drift maintenance. Every SOP that produces a file inherits its location from here.\n\n## Roles (RACI-lite)\n- **Responsible:** Geospatial / Tech Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Domain owners (folder needs)\n- **Informed:** All staff\n\n## Systems & Inputs\n- **Dropbox** — folder tree, folder/file IDs, sharing and permissions.\n- **Folder ID register** (below) — the binding table between an ID and its current display path.\n- **Automation platform** — daily SOP audit binds to the SOP folder ID (TEC-003); credentials per TEC-001.\n\n## Canonical structure (PARA-adjacent)\n```\n/00_KLR/\n├── 01_Projects/     # active client jobs — one folder each\n├── 02_Areas/        # ongoing ops: Sales/, Finance/, HR/, Marketing/, Operations/\n├── 03_Resources/    # reference: supplier catalogs, ICPI specs, brand, templates, KB source\n│   └── standard_operating_procedures/   # canonical SOP store — see folder ID register\n└── 04_Archive/      # closed projects, retired docs\n```\n\n**Per-project folder** — `/01_Projects/[JobID]_[ClientLast]_[StreetAddr]/`:\n```\n01_Design/          # renders, 3D models      (DES-004, DES-002/003)\n02_Estimate/        # takeoff, estimate        (DES-005)\n03_Contract/        # contract, deposit, COs   (CON-001, CON-004)\n04_HOA-Permit/      # HOA + permit packages    (CON-002, CON-003)\n05_Production/      # schedule, logs, POs      (PRO-002/003/005)\n06_Photos/          # site + QC photos         (DES-001, FLD-002/003)\n07_Closeout-Warranty/ # sign-off, warranty     (PRO-006, CX-001/002)\n```\n\n**Conventions:** Job ID `[YYYY]-[###]` sequential. Project files `[JobID]_[doctype]_v[N]`. SOP files per framework §2 (`SOP-XXX-###_...`). No file lives outside `/00_KLR/`.\n\n## Folder ID register (canonical bindings)\n\nA Dropbox folder ID persists across **move and rename**; the display path does not. Any SOP, script, or automation that must reach a folder deterministically cites the ID. The path column is a human convenience and is expected to drift.\n\n| Binding | Folder ID | Current display path (informational) | Bound by |\n|---|---|---|---|\n| SOP corpus | `id:sjRX_pO2EuYAAAAAAAAMYg` | `/03_Resources/standard_operating_procedures/` | TEC-003 daily audit, TEC-004 KB index, `build/daily_audit.py` |\n\nExtend this table before any new automation binds to a folder. `list_folder` accepts an ID in the `path` parameter, so an ID is a drop-in substitute wherever a path was used.\n\n**Superseded SOP-path references.** `/KLR-SOPs/` (framework §6, never created), `/02_Areas/SOPs/` (TEC-002 v1.0, never created), and `/03_Resources/Reference/SOP/` (TEC-002 v1.0 reconciliation, never created) are all dead. The corpus has only ever lived at the path now bound above. No migration is required; the ID binding is what prevents a fourth entry on this list.\n\n> *Trade-off noted:* under strict PARA, SOPs are an ongoing responsibility (Areas) rather than reference material (Resources). Documenting and ID-binding the real location was chosen over relocating live files. Because the binding is by ID, a future relocation costs nothing but a path-column update — which is the point of v1.1.\n\n## Procedure\n1. **Establish root** PARA structure under `/00_KLR/`. → *Output: root.*\n2. **Define project template** + Job ID convention; save a template folder in `03_Resources/templates/`. → *Output: project template.*\n3. **Publish naming standard** (docs, versions, SOP IDs). → *Output: naming standard.*\n4. **Register the folder ID** for any folder an SOP or automation references — capture ID, current path, and what binds to it in the register above. → *Output: folder ID register entry.*\n5. **Provision access** per role (TEC-001). → *Output: permissions.*\n6. **Migrate/audit** existing content into the structure. → *Output: migrated structure.*\n7. **Maintain** — new projects instantiate the template (automatable per TEC-003); periodic drift audit; on any move or rename, update the path column only — never re-key an automation to a new path. Archive to `04_Archive/` on closeout (PRO-006/CX-001). → *Output: maintained structure.*\n\n## Acceptance Criteria / QC\n**Every SOP file reference resolves to exactly one Dropbox folder ID; no file lives outside the structure.** Concretely:\n- Canonical `/00_KLR/` PARA root exists.\n- Every folder referenced by an SOP or automation appears in the folder ID register with a current ID.\n- No SOP or script binds to a display path where an ID exists.\n- Project template + Job ID convention defined and in use.\n- Naming standard published; access provisioned per role.\n- Existing content migrated; new projects instantiate the template.\n- Superseded path references (`/KLR-SOPs/`, `/02_Areas/SOPs/`, `/03_Resources/Reference/SOP/`) carry no live bindings.\n\n## Exceptions & Escalation\n- **Content that doesn't fit** a bucket → Tech Manager assigns a home; extend the taxonomy deliberately, don't dump at root.\n- **Folder ID changes** (folder deleted and recreated rather than moved — Dropbox issues a new ID) → treat as a break: update the register and every binding in the same change, then re-run the affected automation manually before trusting its schedule.\n- **Migration conflict / duplicate** → resolve to canonical, archive the rest (never permanent-delete without confirmation).\n- **Access request beyond role** → Operations Manager (TEC-001).\n\n## Outputs\nCanonical Dropbox structure + folder ID register + naming standard + project template → substrate for **all** project SOPs; SOP-corpus binding feeds **TEC-003** automation and **TEC-004** KB index; backup scope feeds **TEC-006**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.1 | 2026-08-17 | Tech Manager | Canonical references re-keyed from display path to **Dropbox folder ID**; added Systems & Inputs and the folder ID register; corrected the SOP-corpus path to `/03_Resources/standard_operating_procedures/` and retired all three superseded path references; acceptance criterion restated against IDs. |\n| v1.0 | 2026-08-17 | Tech Manager | Initial. PARA-adjacent `/00_KLR/` root + per-project template mapped to SOP outputs; Job ID + naming standard; reconciled framework §6 SOP path; unblocked PARA migration. |\n", "TEC-003": "# SOP-TEC-003 · Zapier Automation Governance & Change Log\n\n| Field | Value |\n|-------|-------|\n| Owner | Geospatial / Tech Manager |\n| Version | v1.1 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | TEC-001, TEC-002, TEC-004, TEC-006, SAL-003, SAL-005, CX-003, CX-004 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n> **Platform lane (v1.1):** Zapier is the **sole** automation platform of record. TEC-007 (n8n) is retired as of 2026-08-17; workflows that outgrow a Zap are handled by a scheduled script under change control (see Exceptions), not by a second platform.\n\n## Purpose\nGovern Zapier automations — cataloging, ownership, naming, change control, credential hygiene, and monitoring — so Zaps are traceable, don't break silently, and can be audited and rolled back.\n\n## Scope / Trigger\nStanding SOP. Fires on any Zap create/change/retire, plus **[weekly]** monitoring. Covers all production Zaps and any scheduled script standing in for one.\n\n## Roles (RACI-lite)\n- **Responsible:** Geospatial / Tech Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Process owner of the automated SOP\n- **Informed:** Affected domain team\n\n## Systems & Inputs\n- **Zapier** — Zaps, task history, versioning.\n- **Dropbox** — Zap catalog + change log; locations bound by folder ID per TEC-002; credentials per TEC-001.\n\n## Zap catalog\n\nEvery live Zap appears here with an owner and the process it serves. A Zap absent from this table is out of compliance regardless of whether it works.\n\n| Zap | Trigger → Action | Systems | Owner | Serves | Status |\n|---|---|---|---|---|---|\n| `schedule→dropbox_daily-sop-audit` | Schedule by Zapier (daily 05:00) → Code by Zapier → Filter → Email | Zapier, Dropbox | Tech Manager | TEC-002 (corpus integrity), TEC-004 (KB currency), GOV-000 (review-date surfacing) | Live — pending first manual run |\n\n**`schedule→dropbox_daily-sop-audit` — detail**\n\n- **Purpose:** pull the SOP corpus from the Dropbox folder bound in TEC-002 (`id:sjRX_pO2EuYAAAAAAAAMYg`), diff it against the last audit by file `rev`, republish the bundle and the SOP GUI build artifact, and report what changed.\n- **Steps:** 1 Schedule (daily 05:00, weekends on) · 2 Code by Zapier (JavaScript, `build/zapier/code_step_daily_audit.js`) · 3 Filter (continue only if `changed` is true) · 4 Email summary · 5 *optional* Trello card when `removed_count > 0`.\n- **Cost:** ~3 tasks/day (≈90/month); quiet days stop at the Filter.\n- **Guards:** aborts rather than publishing an empty corpus over a good one; diffs by `rev`, not timestamp.\n- **Known constraint:** Code by Zapier times out at 10s (Starter) / 30s (Pro+). The step performs ~31 parallel downloads plus two uploads. Fallback is `rebuildHtml = no`, or the `build/daily_audit.py` equivalent on Task Scheduler (exit 0 / 10 / 1).\n- **Credential:** a long-lived Dropbox token in the Code step's Input Data — Code by Zapier cannot borrow the app connection's auth. Inventoried under TEC-001; scope to the SOP folder and rotate on the standard cycle. **Open item, not yet scoped or rotated.**\n- **Build guide:** `build/zapier/ZAPIER_daily_audit.md`.\n\n## Procedure\n1. **Catalog each Zap** in the table above — name, purpose, trigger→action, systems touched, owner, and the **SOP/process it serves**. → *Output: Zap catalog.*\n2. **Naming convention** — `[system]→[system]_[purpose]` so Zaps self-describe. → *Output: named Zaps.*\n3. **Change control** — log every change (what/when/why/who); **test before enabling on live**; note the version in the catalog. → *Output: change log.*\n4. **Credential hygiene** — shared service accounts (not personal) where possible, inventoried in TEC-001; MFA; tokens embedded in Code steps are scoped and rotated on schedule. → *Output: credential control.*\n5. **[Weekly] monitoring** — review task history/errors; alert on failures; owner triages. → *Output: monitoring log.*\n6. **Retire** obsolete Zaps — disable, archive, log, strike from the catalog. → *Output: retirement record.*\n\n## Acceptance Criteria / QC\n**No undocumented or unowned Zap runs in production; every change is logged and tested before going live.** Concretely:\n- Every live Zap appears in the catalog with owner + linked process.\n- Naming convention followed.\n- Changes logged and tested before activation.\n- Errors reviewed weekly.\n- Obsolete Zaps retired and logged.\n- Every credential embedded in a Zap is inventoried in TEC-001 and inside its rotation window.\n\n## Exceptions & Escalation\n- **Zap failure affecting a live process** (e.g., SAL-003 confirmations) → owner triages immediately; manual fallback per the affected SOP.\n- **Automation outgrowing the Zapier lane** (step timeout, branching, volume) → move the work to a scheduled script in the repo under this SOP's change control — as the daily audit does with `daily_audit.py`. The Zap is retained as reporter where it still earns its task cost. Do not stand up a second automation platform.\n- **Credential compromise** → rotate (TEC-001), audit affected Zaps.\n\n## Outputs\nZap catalog, change log, monitoring records → Dropbox. Supports automated SOPs (SAL-003/005, CX-003/004) and the TEC-002/TEC-004 corpus pipeline.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.1 | 2026-08-17 | Tech Manager | Added the Zap catalog table and the `schedule→dropbox_daily-sop-audit` entry (step 1 of its own procedure). Zapier designated sole automation platform on TEC-007 retirement; overflow lane redirected from n8n to scheduled scripts under this SOP. Credential-rotation acceptance criterion added for tokens embedded in Code steps. |\n| v1.0 | 2026-08-17 | Tech Manager | Initial. Zap catalog + naming + SOP linkage; test-before-live change control; weekly error monitoring; lane boundary vs. n8n. |\n", "TEC-004": "# SOP-TEC-004 · Knowledge Base Indexing & LLM Retrieval Maintenance\n\n| Field | Value |\n|-------|-------|\n| Owner | Geospatial / Tech Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | TEC-002, TEC-006, GOV-000, (all SOPs as source) |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nGovern the KB corpus that feeds LLM retrieval — what's indexed, how it's structured/chunked, how it's versioned and refreshed, and how retrieval quality is checked — so the model returns **accurate, current, traceable** answers grounded in KLR's own knowledge rather than stale or hallucinated content.\n\n## Scope / Trigger\nStanding SOP. Fires on any source change (SOP version bump, supplier-doc update, new corpus) plus **[monthly]** retrieval QC. Covers source inventory, schema, indexing, provenance, and eval. The **SOP corpus itself is a primary source** — SOP IDs (framework §2) were designed as collision-free retrieval keys.\n\n## Roles (RACI-lite)\n- **Responsible:** Geospatial / Tech Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Source owners (SOP owners, whoever maintains supplier/spec docs)\n- **Informed:** LLM-tool users across the company\n\n## Systems & Inputs\n- **Dropbox** `/03_Resources/` — KB source store (TEC-002).\n- JSON/JSONL corpus + retrieval index.\n- Sources: SOP corpus + register (GOV-000), supplier docs (e.g., SiteOne help → JSONL), brand guidelines, ICPI/spec references, pricing, process docs.\n\n## Procedure\n1. **Source inventory** — list every corpus feeding the KB, each with an owner and a refresh trigger. → *Output: source inventory.*\n2. **Schema standard** — enforce a consistent JSON/JSONL record: `id`, `source`, `title`, `section`, `content`, and metadata (`doc_type`, `version`, `effective_date`, `status`, `tags`); define chunking. → *Output: schema + chunking standard.*\n3. **Index / re-index on source change** — only content at **status = Active/approved** is indexed as **authoritative**; Draft content is tagged as such, not served as authoritative. → *Output: current index.*\n4. **Provenance** — every chunk carries source + version so any answer is traceable and auditable. → *Output: provenance-tagged corpus.*\n5. **[Monthly] retrieval QC** — run representative queries; confirm correct, current chunks return; flag stale/duplicate/conflicting records. → *Output: retrieval eval.*\n6. **Retire superseded records** on version bump so old versions aren't retrieved. → *Output: clean index.*\n\n## Acceptance Criteria / QC\n**Every retrievable chunk is schema-conformant, provenance-tagged, and current — no stale or unapproved content is served as authoritative.** Concretely:\n- Source inventory current with owners + refresh triggers.\n- All records conform to schema with provenance metadata.\n- Only Active/approved content indexed as authoritative.\n- Re-index performed on source change.\n- Monthly retrieval eval run; issues flagged.\n- Superseded records retired.\n\n## Exceptions & Escalation\n- **Retrieval returns stale/conflicting content** → pull the offending records, re-index, log; investigate the refresh trigger that missed.\n- **Source of unknown authority** → do not index as authoritative until an owner + status are assigned.\n- **Corpus loss/corruption** → restore from backup (TEC-006).\n\n## Outputs\nSchema-conformant, provenance-tagged KB corpus + index + eval records → Dropbox `/03_Resources/`. Backed up via **TEC-006**; consumes the SOP corpus (**GOV-000** + register).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Tech Manager | Initial. Source inventory + JSON/JSONL schema with provenance; Active-only-authoritative indexing; monthly retrieval eval; superseded-record retirement. SOP corpus treated as a first-class source. |\n", "TEC-006": "# SOP-TEC-006 · Data Backup & Retention\n\n| Field | Value |\n|-------|-------|\n| Owner | Geospatial / Tech Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | TEC-002, TEC-004, TEC-007, TEC-009, CON-001, FIN-001 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date. **Legal record-retention periods must be verified with counsel.**\n\n## Purpose\nEnsure business-critical data across the stack is backed up on a defined schedule, retained per policy/legal requirements, and **restorable** — so no single failure (Dropbox loss, n8n instance failure, accidental deletion, ransomware, account loss) causes unrecoverable data loss.\n\n## Scope / Trigger\nStanding SOP with scheduled backups per data class and **[quarterly]** restore testing. Covers all critical stores. Resolves TEC-007's backup dependency (n8n workflows + credential store).\n\n## Roles (RACI-lite)\n- **Responsible:** Geospatial / Tech Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Counsel (record-retention periods), data-store owners\n- **Informed:** Principal\n\n## Core principle\n**Sync ≠ backup, and vendor redundancy ≠ your backup.** Dropbox versioning and SaaS provider redundancy protect against *their* hardware failure — not against user deletion, ransomware propagation, or account loss. Critical data needs an **independent** copy.\n\n## Systems & Inputs\n- Backup targets: **Dropbox** (project + ops data, TEC-002), **n8n** (`klrbuild.app.n8n.cloud` — workflows + credential store, TEC-007), **Contractor Foreman** (export), **M365** (mail retention, TEC-009), **KB corpus** (TEC-004), **SalesRabbit**.\n\n## Procedure\n1. **Backup scope inventory** — each store: criticality, change rate, native vs. required-external backup, retention requirement. → *Output: backup inventory.*\n2. **Schedule per data class** — e.g., Dropbox versioned + periodic **independent** export; n8n workflow/credential export **[weekly / on-change]**; Contractor Foreman export **[cadence]**; KB corpus with sources. → *Output: backup schedule.*\n3. **Apply 3-2-1** — 3 copies, 2 media/ function mdToHtml(md) {
  if (!md) return '';
  let html = md;
  // code blocks
  html = html.replace(/```([^`]*?)```/gs, (m, code) => `<pre><code>${escHtml(code.replace(/^\w*\n/,''))}</code></pre>\n`);
  // inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // tables
  html = html.replace(/(\|.+\|[\r\n]+\|[-| :]+\|[\r\n]+((?:\|.+\|[\r\n]*)+))/gm, (m) => {
    const rows = m.trim().split('\n').filter(r => r.trim());
    if (rows.length < 2) return m;
    const parseRow = r => r.split('|').slice(1,-1).map(c => c.trim());
    const headers = parseRow(rows[0]);
    let t = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
    for (let i = 2; i < rows.length; i++) {
      const cells = parseRow(rows[i]);
      t += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
    }
    // trailing \n is load-bearing: without it the next line is no longer at a
    // line start and every ^## heading after a table silently fails to parse
    return t + '</tbody></table>\n';

  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');

  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');

  html = html.replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul>$1</ul>');

  });

function parseMeta(md) {
  const fields = {};
  // only the leading metadata table — later spec tables use the same pipe syntax
  for (const line of md.split('\n').slice(0, 20)) {
    const m = line.match(/^\| *([A-Za-z][^|]*?) *\| *(.*?) *\|\s*$/);
    if (m && m[1] !== 'Field' && !/^-+$/.test(m[1])) fields[m[1]] = m[2];
  }

}

function headingsOf(md) {
  return [...md.matchAll(/^## +(.+)$/gm)].map(m => m[1].trim());

function parseDate(v) {
  if (!v || UNSET.test(v.trim())) return null;
  const d = new Date(v.trim());
  return isNaN(d) ? null : d;
}

// Review state per GOV-000: every Active SOP reviewed annually minimum.
function reviewState(fields) {
  const next = parseDate(fields['Next review']);
  const last = parseDate(fields['Last reviewed']);
  if (!next && !last) return {code: 'unset', label: 'No review date', days: null};
  const due = next || new Date(last.getTime() + 365 * 864e5);
  const days = Math.round((due - Date.now()) / 864e5);
  if (days < 0) return {code: 'overdue', label: `Overdue ${Math.abs(days)}d`, days};
  if (days <= 60) return {code: 'due', label: `Due in ${days}d`, days};
  return {code: 'ok', label: `Due in ${days}d`, days};
}

function conformance(id) {

  const fields = parseMeta(md);

    .map(([name]) => name);
  const missingFields = REQUIRED_FIELDS.filter(f => !(f in fields) || UNSET.test(fields[f] || ''));
  return {
    id, fields, heads, missingSections, missingFields,
    review: reviewState(fields),
    conformant: !missingSections.length && !missingFields.length

}

      html += `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.title}</span>`;
      if (s.tier) html += `<span class="tier ${tierCls}">${s.tier}</span>`;
      html += '</div>';
    }
    html += '</div></div>';
  }
  nav.innerHTML = html;
  const st = stats();
  const fc = document.getElementById('footerCount');
  fc.textContent = `${st.authored} / ${st.total} authored`;
  if (BUILD.generated) fc.title = `Built ${BUILD.generated} from ${BUILD.source || 'Markdown corpus'}`;
}

function toggleSection(el) {
  const sec = el.parentElement;
  sec.classList.toggle('collapsed');
  el.setAttribute('aria-expanded', String(!sec.classList.contains('collapsed')));
}

let currentView = 'dashboard';
let currentSop = null;

// ──────────────────────── ROUTING ────────────────────────
// Hash routes make every SOP citable from Trello / Contractor Foreman / SMS
// and restore Back-button + refresh behaviour.
function hashFor(view, id) { return view === 'sop' && id ? `#/sop/${id}` : `#/${view}`; }

function navigateTo(view, id, push = true) {
  currentView = view;
  currentSop = id || null;
  if (push) {
    const h = hashFor(view, id);
    if (location.hash !== h) history.pushState(null, '', h);
  }
  document.querySelectorAll('.nav-special,.nav-item').forEach(el => {
    el.classList.remove('active');
    el.removeAttribute('aria-current');
  });
  const el = (view === 'sop' && id)
    ? document.querySelector(`.nav-item[data-sop="${id}"]`)
    : document.querySelector(`.nav-special[data-view="${view}"]`);
  if (el) { el.classList.add('active'); el.setAttribute('aria-current', 'page'); }
  renderView();
  document.getElementById('mainContent').scrollTop = 0;
  toggleSidebar(false);
}

const VALID_VIEWS = ['dashboard','register','spine','governance','framework','sop'];
function routeFromHash() {
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  let view = parts[0] || 'dashboard';
  let id = parts[1] ? decodeURIComponent(parts[1]) : null;
  if (!VALID_VIEWS.includes(view)) { view = 'dashboard'; id = null; }
  if (view === 'sop' && !SOPS.some(s => s.id === id)) { view = 'dashboard'; id = null; }
  navigateTo(view, id, false);
}

function jumpTo(anchorId) {
  const el = document.getElementById(anchorId);
  if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function copyLink(id) {
  const url = location.href.split('#')[0] + hashFor('sop', id);
  const done = () => {
    const b = document.getElementById('copyBtn');
    if (!b) return;
    b.textContent = '✓ Copied';
    setTimeout(() => { b.textContent = '⧉ Copy link'; }, 1600);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(done);
  else done();
}

// ──────────────────────── SIDEBAR / KEYBOARD ────────────────────────
function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const open = force === undefined ? !sb.classList.contains('open') : force;
  sb.classList.toggle('open', open);
  document.getElementById('scrim').classList.toggle('show', open);
  document.querySelector('.mobile-toggle').setAttribute('aria-expanded', String(open));
}

// Every clickable div/span/tr carries role="button" or .clickable; one delegated
// handler gives the whole surface Enter/Space activation without 88 inline dupes.
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches?.('[role="button"],tr.clickable')) {
    e.preventDefault();
    t.click();
    return;
  }
  if (e.key === 'Escape') {
    toggleSidebar(false);
    const s = document.getElementById('searchInput');
    if (document.activeElement === s && s.value) { s.value = ''; filterNav(''); }
    return;
  }
  // "/" focuses search, unless already typing somewhere
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

function renderView() {
  const main = document.getElementById('mainContent');
  let html = '<div class="main-inner fade-in">';
  switch(currentView) {
    case 'dashboard': html += renderDashboard(); break;
    case 'register': html += renderRegister(); break;
    case 'spine': html += renderSpine(); break;
    case 'governance': html += renderGovernance(); break;
    case 'framework': html += renderFramework(); break;
    case 'sop': html += renderSop(currentSop); break;
  }
  html += '</div>';
  main.innerHTML = html;
}

// ──────────────────────── REGISTER ────────────────────────
let registerFilter = {tier: null, status: null, domain: null};

let registerSort = {key: 'id', dir: 1};

function renderRegister() {
  const st = stats();
  let h = `<div class="page-header"><h2>SOP Register</h2><p>Single source of truth for SOP status — ${st.total} SOPs catalogued, ${st.authored} authored</p></div>`;

  // Filters
  h += '<div class="register-controls">';
  h += '<span style="font-size:12px;color:var(--fg3);margin-right:4px">Tier:</span>';
  for (const t of ['P1','P2','P3']) {
    h += `<button class="filter-btn${registerFilter.tier===t?' active':''}" onclick="toggleFilter('tier','${t}')">${t}</button>`;
  }
  h += '<span style="font-size:12px;color:var(--fg3);margin:0 4px 0 12px">Status:</span>';
  for (const s of ['Draft','Registered','Retired']) {
    h += `<button class="filter-btn${registerFilter.status===s?' active':''}" onclick="toggleFilter('status','${s}')">${s}</button>`;
  }
  h += `<button class="filter-btn" onclick="registerFilter={tier:null,status:null,domain:null};renderView()" style="margin-left:auto">Clear filters</button>`;
  h += '</div>';
  h += '<div class="register-controls" style="margin-top:-4px">';
  h += '<span style="font-size:12px;color:var(--fg3);margin-right:4px">Domain:</span>';
  for (const d of DOMAIN_ORDER) {
    h += `<button class="filter-btn${registerFilter.domain===d?' active':''}" style="--dom-c:var(--dom-${d})${registerFilter.domain===d?';background:var(--dom-c);border-color:var(--dom-c)':''}" onclick="toggleFilter('domain','${d}')">${d}</button>`;
  }
  h += '</div>';

  let filtered = SOPS.filter(s => s.id !== 'GOV-000');
  if (registerFilter.tier) filtered = filtered.filter(s => s.tier === registerFilter.tier);
  if (registerFilter.status) filtered = filtered.filter(s => s.status === registerFilter.status);
  if (registerFilter.domain) filtered = filtered.filter(s => s.domain === registerFilter.domain);

  const k = registerSort.key;
  filtered = filtered.slice().sort((a, b) => {
    const av = (a[k] ?? '~').toString(), bv = (b[k] ?? '~').toString();
    return av.localeCompare(bv, undefined, {numeric: true}) * registerSort.dir;
  });

  h += `<div style="font-size:12px;color:var(--fg3);margin-bottom:8px">${filtered.length} of ${st.total} shown${registerFilter.domain?` · ${DOMAINS[registerFilter.domain].name}`:''}</div>`;

  // Table
  const cols = [['id','ID'],['title','Title'],['domain','Domain'],['tier','Tier'],['status','Status'],['ver','Version'],['owner','Owner']];
  h += '<table class="register-table"><thead><tr>';
  for (const [key, label] of cols) {
    const arrow = k === key ? (registerSort.dir === 1 ? ' ▲' : ' ▼') : '';
    const aria = k === key ? (registerSort.dir === 1 ? 'ascending' : 'descending') : 'none';
    h += `<th role="button" tabindex="0" aria-sort="${aria}" style="cursor:pointer;user-select:none" onclick="sortRegister('${key}')">${label}${arrow}</th>`;
  }
  h += '</tr></thead><tbody>';

  for (const s of filtered) {
    const hasContent = SOP_CONTENT[s.id];
    const attrs = hasContent ? ` class="clickable" tabindex="0" onclick="navigateTo('sop','${s.id}')"` : '';
    const tierCls = s.tier ? s.tier.toLowerCase() : '';
    const statusCls = s.status.toLowerCase();
    h += `<tr${attrs}>`;
    h += `<td><span class="dom-tag" data-dom="${s.domain}" style="--dom-c:var(--dom-${s.domain})">${s.id}</span></td>`;
    h += `<td>${s.title}${s.cluster ? ` <span style="font-size:10px;color:var(--fg3)">[${s.cluster}]</span>` : ''}</td>`;
    h += `<td>${s.domain}</td>`;
    h += `<td>${s.tier ? `<span class="badge ${tierCls}">${s.tier}</span>` : '—'}</td>`;
    h += `<td><span class="badge ${statusCls}">${s.status}</span></td>`;
    h += `<td style="font-family:var(--mono);font-size:12px">${s.ver || '—'}</td>`;
    h += `<td style="font-size:12px">${s.owner}</td>`;
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (!filtered.length) h += '<div style="padding:32px;text-align:center;color:var(--fg3);font-size:13px">No SOPs match these filters.</div>';
  return h;
}

function toggleFilter(key, val) {
  registerFilter[key] = registerFilter[key] === val ? null : val;
  renderView();
}

function sortRegister(key) {
  registerSort = {key, dir: registerSort.key === key ? -registerSort.dir : 1};
  renderView();
}

function filterByDomain(dom) {
  registerFilter = {tier: null, status: null, domain: dom};
  navigateTo('register');
}

// ──────────────────────── SOP READER ────────────────────────
function renderSop(id) {
  const sop = SOPS.find(s => s.id === id);
  if (!sop) return '<p>SOP not found.</p>';
  const content = SOP_CONTENT[id];

  let h = '<div class="sop-reader">';
  h += '<div class="sop-header">';
  h += '<div class="sop-id-row">';
  h += `<div class="sop-id">${sop.id}${sop.cluster ? ` · ${sop.cluster}` : ''}</div>`;
  h += `<button class="copy-link" id="copyBtn" onclick="copyLink('${sop.id}')">⧉ Copy link</button>`;
  h += `<button class="copy-link" style="margin-left:0" onclick="window.print()">⎙ Print</button>`;
  h += '</div>';
  h += `<h2>${sop.title}</h2>`;
  h += '<div class="sop-meta">';
  if (sop.tier) h += `<span class="badge ${sop.tier.toLowerCase()}">${sop.tier}</span>`;
  h += `<span class="badge ${sop.status.toLowerCase()}">${sop.status}${sop.ver ? ' ' + sop.ver : ''}</span>`;
  h += `<span class="badge" style="background:var(--bg3);color:var(--fg2)">${sop.owner}</span>`;
  h += `<span class="badge" style="background:var(--bg3);color:var(--fg2)">${sop.domain} — ${DOMAINS[sop.domain]?.name || ''}</span>`;
  h += '</div>';
  // Provenance — TEC-004 requires every served chunk be traceable to a source
  // and revision. Same obligation applies to what a human reads on screen.
  if (SOURCE.mode === 'live' && sop.rev) {
    h += `<div class="doc-meta">rev ${escHtml(sop.rev.slice(0, 12))} · modified ${sop.modified ? new Date(sop.modified).toLocaleString() : '—'} · live from Dropbox</div>`;
  } else if (SOP_CONTENT[id]) {
    const mf = SOURCE.manifest?.[id];
    h += `<div class="doc-meta">`
      + (mf?.rev ? `rev ${escHtml(String(mf.rev).slice(0, 12))} · ` : '')
      + `audited ${escHtml(SOURCE.at || '—')}</div>`;
  }
  h += '</div>';

  if (content) {
    const conf = conformance(id);

    // Section jump list — these documents run 2+ printed pages
    const heads = conf.heads;
    if (heads.length > 2) {
      h += '<nav class="sop-toc" aria-label="Sections"><h4>Sections</h4><div class="link-list">';
      for (const t of heads) {
        h += `<span class="link-item" role="button" tabindex="0" onclick="jumpTo('s-${slug(t)}')">${escHtml(t)}</span>`;
      }
      h += '</div></nav>';
    }

    if (!conf.conformant) {
      const bits = [];
      if (conf.missingSections.length) bits.push(`missing <strong>${conf.missingSections.length}</strong> required section${conf.missingSections.length>1?'s':''} (${conf.missingSections.join(', ')})`);
      if (conf.missingFields.length) bits.push(`unset field${conf.missingFields.length>1?'s':''}: ${conf.missingFields.join(', ')}`);
      h += `<div class="gov-flag">⚠ <strong>Not template-conformant</strong> — ${bits.join('; ')}. <span role="button" tabindex="0" onclick="navigateTo('governance')" style="color:var(--accent);cursor:pointer;text-decoration:underline">See governance</span></div>`;
    }

    h += '<div class="sop-body">';
    h += mdToHtml(content);
    h += '</div>';

    // Linked SOPs
    const linkedMatch = content.match(/Linked SOPs\s*\|\s*([^|]+)\|/);
    if (linkedMatch) {
      const links = linkedMatch[1].split(',').map(s => s.trim()).filter(Boolean);
      h += '<div class="sop-links"><h4>Linked SOPs</h4><div class="link-list">';
      for (const l of links) {
        const linked = SOPS.find(s => s.id === l);
        const hasContent = SOP_CONTENT[l];
        if (linked && hasContent) {
          h += `<span class="link-item" role="button" tabindex="0" onclick="navigateTo('sop','${l}')">${l} · ${linked.title}</span>`;
        } else if (linked) {
          h += `<span class="link-item" style="opacity:.5">${l} · ${linked.title}</span>`;
        }
      }
      h += '</div></div>';
    }
  } else {
    h += '<div style="padding:40px;text-align:center;color:var(--fg3)">';
    h += '<div style="font-size:32px;margin-bottom:12px">☷</div>';
    h += `<p>This SOP is <strong>registered</strong> but not yet authored.</p>`;
    h += `<p style="font-size:13px;margin-top:8px">Tier: ${sop.tier || '—'} · Owner: ${sop.owner}</p>`;
    h += '</div>';
  }
  h += '</div>';
  return h;
}

// ──────────────────────── GOVERNANCE ────────────────────────
function renderGovernance() {
  const rows = allConformance();
  const conformant = rows.filter(r => r.conformant).length;
  const noDate = rows.filter(r => r.review.code === 'unset').length;
  const overdue = rows.filter(r => r.review.code === 'overdue').length;
  const dueSoon = rows.filter(r => r.review.code === 'due').length;

  // Which required sections are most often absent — tells you what to batch-fix
  const gap = {};
  for (const r of rows) for (const s of r.missingSections) gap[s] = (gap[s] || 0) + 1;
  const gapRanked = Object.entries(gap).sort((a, b) => b[1] - a[1]);

  let h = '<div class="page-header"><h2>Governance</h2><p>Conformance of the ' + rows.length + ' authored SOPs against the SOP-GOV-000 v1.12 template and review cadence</p></div>';

  h += '<div class="dash-grid">';
  h += `<div class="stat-card"><div class="label">Template conformant</div><div class="value${conformant?' accent':''}">${conformant}/${rows.length}</div><div class="sub">all 9 sections + 6 metadata fields</div></div>`;
  h += `<div class="stat-card"><div class="label">No review date</div><div class="value" style="color:var(--p1)">${noDate}</div><div class="sub">cadence not enforceable</div></div>`;
  h += `<div class="stat-card"><div class="label">Review overdue</div><div class="value"${overdue?' style="color:var(--p1)"':''}>${overdue}</div><div class="sub">past Next review</div></div>`;
  h += `<div class="stat-card"><div class="label">Due ≤ 60 days</div><div class="value"${dueSoon?' style="color:var(--p2)"':''}>${dueSoon}</div><div class="sub">schedule now</div></div>`;
  h += '</div>';

  if (noDate === rows.length) {
    h += '<blockquote style="border-left:3px solid var(--p1);background:var(--p1-bg);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;margin-bottom:24px;font-size:13px;color:var(--fg)">';
    h += '<strong>No SOP carries a review date.</strong> GOV-000 mandates annual review of every Active SOP, but <code>Effective</code> / <code>Last reviewed</code> / <code>Next review</code> are unset or absent across all ' + rows.length + ' authored SOPs, so the cadence cannot be tracked or audited. Populating those three fields is what turns the cards above from static to live.';
    h += '</blockquote>';
  }

  if (gapRanked.length) {
    h += '<div class="section-title">Most common template gaps</div>';
    h += '<div class="coverage-chart">';
    for (const [name, n] of gapRanked) {
      const p = pct(n, rows.length);
      h += '<div class="cov-row">';
      h += `<div class="cov-label" style="width:150px;text-align:left;font-family:var(--font);font-size:12px">${name}</div>`;
      h += `<div class="cov-bar-wrap"><div class="cov-bar" style="width:${p}%;background:var(--p1)"></div></div>`;
      h += `<div class="cov-count">${n} / ${rows.length}</div>`;
      h += '</div>';
    }
    h += '</div>';
  }

  h += '<div class="section-title">Per-SOP conformance</div>';
  h += '<table class="register-table"><thead><tr><th>SOP</th><th>Title</th><th>Missing required sections</th><th>Missing fields</th><th>Review</th></tr></thead><tbody>';
  for (const r of rows) {
    const sop = SOPS.find(s => s.id === r.id);
    const rc = r.review.code;
    const color = rc === 'overdue' ? 'var(--p1)' : rc === 'due' ? 'var(--p2)' : rc === 'ok' ? 'var(--p3)' : 'var(--fg3)';
    h += `<tr class="clickable" tabindex="0" onclick="navigateTo('sop','${r.id}')">`;
    h += `<td><span class="dom-tag" data-dom="${sop.domain}" style="--dom-c:var(--dom-${sop.domain})">${r.id}</span></td>`;
    h += `<td style="font-size:12px">${sop.title}</td>`;
    h += `<td style="font-size:12px;color:${r.missingSections.length ? 'var(--fg2)' : 'var(--p3)'}">${r.missingSections.join(', ') || '✓ complete'}</td>`;
    h += `<td style="font-size:12px;color:${r.missingFields.length ? 'var(--fg2)' : 'var(--p3)'}">${r.missingFields.join(', ') || '✓ complete'}</td>`;
    h += `<td style="font-size:12px;color:${color};white-space:nowrap">${r.review.label}</td>`;
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

// ──────────────────────── FRAMEWORK ────────────────────────
