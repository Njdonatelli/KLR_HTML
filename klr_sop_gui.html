<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLR Build — SOP Framework</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fcfcfb;--bg2:#f4f3f0;--bg3:#eae9e4;
  --fg:#0b0b0b;--fg2:#52514e;--fg3:#8a8880;
  --border:#ddd9d0;--border2:#c8c4ba;
  --accent:#2a78d6;--accent-light:#e8f0fb;
  --p1:#e34948;--p1-bg:#fef0f0;
  --p2:#eda100;--p2-bg:#fdf6e5;
  --p3:#1baf7a;--p3-bg:#e8f7f0;
  --draft:#2a78d6;--draft-bg:#e8f0fb;
  --registered:#8a8880;--registered-bg:#f0efeb;
  --retired:#8a5a2a;--retired-bg:#f7efe4;
  --active:#1baf7a;--active-bg:#e8f7f0;
  --radius:6px;--radius-lg:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:0 4px 16px rgba(0,0,0,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",Menlo,Monaco,Consolas,monospace;
  /* domain colors */
  --dom-GOV:#52514e;--dom-SAL:#2a78d6;--dom-DES:#eb6834;
  --dom-CON:#4a3aa7;--dom-PRO:#1baf7a;--dom-FLD:#008300;
  --dom-PRC:#eda100;--dom-FIN:#e87ba4;--dom-SAF:#e34948;
  --dom-TEC:#1baf7a;--dom-CX:#2a78d6;--dom-HR:#eb6834;
}
[data-theme="dark"]{
  --bg:#1a1a19;--bg2:#232322;--bg3:#2e2e2c;
  --fg:#f0efeb;--fg2:#c3c2b7;--fg3:#8a8880;
  --border:#3a3a37;--border2:#4a4a46;
  --accent:#3987e5;--accent-light:#1e2d42;
  --p1:#e66767;--p1-bg:#3a1e1e;
  --p2:#c98500;--p2-bg:#3a2e10;
  --p3:#199e70;--p3-bg:#152e24;
  --draft:#3987e5;--draft-bg:#1e2d42;
  --registered:#8a8880;--registered-bg:#2e2e2c;
  --retired:#c08a4a;--retired-bg:#332a1e;
  --active:#199e70;--active-bg:#152e24;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 4px 16px rgba(0,0,0,.4);
  /* domain hues that fail contrast on a dark ground, lifted */
  --dom-GOV:#a3a199;--dom-FLD:#3fbf4a;--dom-CON:#8c7ce8;--dom-PRC:#f0ae1a;
}
html{font-family:var(--font);font-size:15px;line-height:1.6;color:var(--fg);background:var(--bg)}
body{display:flex;height:100vh;overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* SIDEBAR */
.sidebar{width:260px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
.sidebar-header{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
.sidebar-header p{font-size:11px;color:var(--fg3);margin-top:2px}
.sidebar-search{padding:8px 12px}
.sidebar-search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:13px;color:var(--fg);outline:none}
.sidebar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.sidebar-search{position:relative}
.sidebar-search::before{content:"⌕";position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:14px}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-section{margin-bottom:2px}
.nav-section-header{padding:6px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.nav-section-header .arrow{font-size:9px;transition:transform .15s}
.nav-section.collapsed .arrow{transform:rotate(-90deg)}
.nav-section.collapsed .nav-items{display:none}
.nav-item{padding:5px 16px 5px 28px;font-size:13px;cursor:pointer;color:var(--fg2);display:flex;align-items:center;gap:8px;border-left:3px solid transparent;transition:background .1s}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:500}
.nav-item .id{font-family:var(--mono);font-size:11px;color:var(--fg3);min-width:62px}
.nav-item.active .id{color:var(--accent)}
.nav-item .tier{font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:auto}
.nav-item .tier.p1{background:var(--p1-bg);color:var(--p1)}
.nav-item .tier.p2{background:var(--p2-bg);color:var(--p2)}
.nav-item .tier.p3{background:var(--p3-bg);color:var(--p3)}
.nav-special{padding:5px 16px;font-size:13px;cursor:pointer;color:var(--fg2);display:flex;align-items:center;gap:8px;border-left:3px solid transparent;transition:background .1s;font-weight:500}
.nav-special:hover{background:var(--bg3)}
.nav-special.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent)}
.nav-special .icon{font-size:15px}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--fg3);display:flex;justify-content:space-between;align-items:center}
.theme-toggle{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:3px 8px;cursor:pointer;font-size:11px;color:var(--fg3)}
.theme-toggle:hover{background:var(--bg3);color:var(--fg)}

/* MAIN */
.main{flex:1;overflow-y:auto;background:var(--bg)}
.main-inner{max-width:960px;margin:0 auto;padding:32px 40px 80px}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.stat-card .label{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:700;line-height:1.1}
.stat-card .sub{font-size:12px;color:var(--fg3);margin-top:4px}
.stat-card .value.accent{color:var(--accent)}

.section-title{font-size:18px;font-weight:700;margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title:first-child{margin-top:0}

/* COVERAGE CHART */
.coverage-chart{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.cov-row{display:flex;align-items:center;gap:10px}
.cov-label{width:40px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--fg2);text-align:right}
.cov-bar-wrap{flex:1;height:22px;background:var(--bg3);border-radius:4px;position:relative;overflow:hidden}
.cov-bar{height:100%;border-radius:4px;transition:width .4s ease}
.cov-bar.authored{background:var(--accent)}
.cov-count{font-size:11px;color:var(--fg3);width:50px;text-align:right;font-family:var(--mono)}

/* SPINE */
.spine-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:28px;overflow-x:auto}
.spine-step{display:flex;align-items:flex-start;margin-bottom:12px;position:relative}
.spine-step:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:-12px;width:2px;background:var(--border2)}
.spine-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;position:relative;z-index:1}
.spine-content{margin-left:12px;flex:1}
.spine-label{font-size:13px;font-weight:600;margin-bottom:4px}
.spine-sops{display:flex;flex-wrap:wrap;gap:4px}
.spine-sop{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:var(--bg);transition:all .15s}
.spine-sop:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.spine-sop.authored{background:var(--draft-bg);border-color:var(--draft);color:var(--draft)}
.spine-sop.registered{background:var(--registered-bg);color:var(--registered)}

/* REGISTER TABLE */
.register-controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);font-size:12px;cursor:pointer;color:var(--fg2);transition:all .15s}
.filter-btn:hover{background:var(--bg3)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.register-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.register-table th{text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);border-bottom:2px solid var(--border);font-weight:600;position:sticky;top:0;background:var(--bg)}
.register-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.register-table tr:hover td{background:var(--bg2)}
.register-table tr.clickable{cursor:pointer}
.register-table tr.clickable:hover td{background:var(--accent-light)}
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600}
.badge.draft{background:var(--draft-bg);color:var(--draft)}
.badge.registered{background:var(--registered-bg);color:var(--registered)}
.badge.retired{background:var(--retired-bg);color:var(--retired)}
.badge.active{background:var(--active-bg);color:var(--active)}
.badge.p1{background:var(--p1-bg);color:var(--p1)}
.badge.p2{background:var(--p2-bg);color:var(--p2)}
.badge.p3{background:var(--p3-bg);color:var(--p3)}
.dom-tag{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--bg3);color:var(--fg2);white-space:nowrap}

/* SOP READER */
.sop-reader{max-width:720px}
.sop-header{margin-bottom:24px}
.sop-header .sop-id{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
.sop-header h2{font-size:22px;font-weight:700;margin:4px 0 8px;line-height:1.3}
.sop-meta{display:flex;flex-wrap:wrap;gap:6px}
.sop-body h2{font-size:16px;font-weight:700;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sop-body h3{font-size:14px;font-weight:600;margin:16px 0 6px}
.sop-body p{margin-bottom:10px;color:var(--fg)}
.sop-body ul,.sop-body ol{margin:0 0 10px 20px}
.sop-body li{margin-bottom:4px}
.sop-body strong{font-weight:600}
.sop-body em{font-style:italic;color:var(--fg2)}
.sop-body blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;background:var(--bg2);border-radius:0 var(--radius) var(--radius) 0;font-size:13px;color:var(--fg2)}
.sop-body code{font-family:var(--mono);font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:3px}
.sop-body pre{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;overflow-x:auto;margin:10px 0;font-size:12px;line-height:1.5}
.sop-body pre code{background:none;padding:0}
.sop-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.sop-body table th{text-align:left;padding:6px 10px;border-bottom:2px solid var(--border);font-weight:600;font-size:12px;background:var(--bg2)}
.sop-body table td{padding:6px 10px;border-bottom:1px solid var(--border)}
.sop-links{margin-top:16px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg)}
.sop-links h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);margin-bottom:6px}
.sop-links .link-list{display:flex;flex-wrap:wrap;gap:5px}
.sop-links .link-item{font-family:var(--mono);font-size:12px;padding:3px 8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--fg2);transition:all .15s}
.sop-links .link-item:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* FRAMEWORK READER */
.fw-body{max-width:720px}
.fw-body h1{font-size:20px;font-weight:700;margin-bottom:12px}
.fw-body h2{font-size:16px;font-weight:700;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.fw-body h3{font-size:14px;font-weight:600;margin:16px 0 6px}
.fw-body p{margin-bottom:10px}
.fw-body ul,.fw-body ol{margin:0 0 10px 20px}
.fw-body li{margin-bottom:4px}
.fw-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.fw-body table th{text-align:left;padding:6px 10px;border-bottom:2px solid var(--border);font-weight:600;font-size:12px;background:var(--bg2)}
.fw-body table td{padding:6px 10px;border-bottom:1px solid var(--border)}
.fw-body blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;background:var(--bg2);border-radius:0 var(--radius) var(--radius) 0;font-size:13px;color:var(--fg2)}
.fw-body pre{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;overflow-x:auto;margin:10px 0;font-size:12px;line-height:1.5}
.fw-body code{font-family:var(--mono);font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:3px}
.fw-body pre code{background:none;padding:0}

/* PAGE HEADER */
.page-header{margin-bottom:24px}
.page-header h2{font-size:22px;font-weight:700}
.page-header p{color:var(--fg2);font-size:14px;margin-top:4px}

/* VERIFY TABLE */
.verify-section{margin-bottom:28px}
.verify-section h3{font-size:14px;font-weight:600;margin-bottom:8px}

/* PLACEHOLDER TABLE */
.placeholder-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:28px}
.ph-cell{background:var(--bg);padding:8px 12px;font-size:12px}
.ph-cell.header{background:var(--bg2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)}
.ph-cell .ph-val{font-family:var(--mono);font-size:11px;color:var(--accent)}
.ph-cell .ph-sops{font-size:11px;color:var(--fg3)}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{width:220px;min-width:220px}
  .main-inner{padding:20px 24px 60px}
  .dash-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .sidebar{position:absolute;z-index:100;height:100vh;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:block !important}
  .main-inner{padding-top:52px}
  .sidebar-header{padding-left:52px}
}
.mobile-toggle{display:none;position:fixed;top:10px;left:10px;z-index:101;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;cursor:pointer;font-size:16px;color:var(--fg)}

/* FOCUS — keyboard visibility (WCAG 2.4.7) */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.nav-item:focus-visible,.nav-special:focus-visible,.register-table tr.clickable:focus-visible{outline-offset:-2px}
[role="button"]{cursor:pointer}

/* DOMAIN COLOR CODING */
.nav-item{border-left:3px solid transparent}
.nav-item[data-dom]{border-left-color:color-mix(in srgb,var(--dom-c) 45%,transparent)}
.nav-item[data-dom].active{border-left-color:var(--dom-c)}
.nav-section-header .dom-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;background:var(--dom-c)}
.dom-tag[data-dom]{background:color-mix(in srgb,var(--dom-c) 13%,transparent);color:var(--dom-c)}
[data-theme="dark"] .dom-tag[data-dom]{background:color-mix(in srgb,var(--dom-c) 22%,transparent)}

/* SEARCH RESULTS */
.search-meta{padding:2px 16px 6px;font-size:11px;color:var(--fg3)}
.nav-empty{padding:20px 16px;font-size:12px;color:var(--fg3);text-align:center;line-height:1.5}
.hit-snippet{padding:0 16px 7px 28px;font-size:11px;color:var(--fg3);line-height:1.45;cursor:pointer}
.hit-snippet mark{background:var(--p2-bg);color:var(--fg);padding:0 2px;border-radius:2px}

/* SOP HEADER ACTIONS */
.sop-id-row{display:flex;align-items:center;gap:8px}
.copy-link{margin-left:auto;background:none;border:1px solid var(--border);border-radius:var(--radius);padding:3px 9px;font-size:11px;color:var(--fg3);cursor:pointer;font-family:var(--font)}
.copy-link:hover{background:var(--bg3);color:var(--fg)}

/* TOC + GOVERNANCE FLAG */
.sop-toc{margin-bottom:16px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg)}
.sop-toc h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);margin-bottom:6px}
.sop-toc .link-item{font-family:var(--font);font-size:12px;padding:3px 9px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--fg2);transition:all .15s}
.sop-toc .link-item:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.gov-flag{margin-bottom:16px;padding:9px 14px;background:var(--p2-bg);border-left:3px solid var(--p2);border-radius:0 var(--radius) var(--radius) 0;font-size:12px;color:var(--fg2);line-height:1.5}
html{scroll-behavior:smooth}

/* FRESHNESS INDICATOR */
.freshness{padding:7px 12px;border-top:1px solid var(--border);font-size:11px;display:flex;align-items:center;gap:6px;color:var(--fg3);line-height:1.35}
.freshness .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--fg3)}
.freshness.live .dot{background:var(--p3);box-shadow:0 0 0 3px color-mix(in srgb,var(--p3) 22%,transparent)}
.freshness.stale .dot{background:var(--p2)}
.freshness.error .dot{background:var(--p1)}
.freshness.loading .dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.freshness .label{flex:1;min-width:0}
.freshness .label b{display:block;color:var(--fg2);font-weight:600}
.freshness button{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:2px 7px;cursor:pointer;font-size:11px;color:var(--fg3);font-family:var(--font)}
.freshness button:hover{background:var(--bg3);color:var(--fg)}
.doc-meta{font-size:11px;color:var(--fg3);margin-top:6px;font-family:var(--mono)}

/* SIDEBAR SCRIM (mobile) */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.scrim.show{display:block}

/* PRINT — make every SOP a distributable PDF */
@media print{
  html{font-size:11pt;background:#fff;color:#000}
  body{display:block;height:auto;overflow:visible}
  .sidebar,.mobile-toggle,.scrim,.copy-link,.register-controls,.theme-toggle{display:none !important}
  .main{overflow:visible;height:auto}
  .main-inner{max-width:none;padding:0}
  .sop-reader,.fw-body{max-width:none}
  .fade-in{animation:none}
  a{color:#000;text-decoration:none}
  .sop-body h2,.sop-body h3,.section-title{break-after:avoid}
  .sop-body table,.register-table,.spine-wrap,pre,blockquote{break-inside:avoid}
  .badge,.dom-tag{border:1px solid #999;color:#000 !important;background:#fff !important}
  .register-table th{position:static}
  .sop-body pre,.fw-body pre{white-space:pre-wrap}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

/* TRANSITIONS */
.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<button class="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false" onclick="toggleSidebar()">☰</button>
<div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>KLR Build LLC</h1>
    <p>SOP Framework v1.12 &middot; GOV-000</p>
  </div>
  <div class="sidebar-search">
    <input type="search" id="searchInput" aria-label="Search SOPs by ID, title, or full text" placeholder="Search SOPs…  ( / )" oninput="filterNav(this.value)">
  </div>
  <nav class="sidebar-nav" id="sidebarNav" aria-label="SOP navigation"></nav>
  <div class="freshness" id="freshness" role="status" aria-live="polite"></div>
  <div class="sidebar-footer">
    <span id="footerCount"></span>
    <button class="theme-toggle" onclick="toggleTheme()">◑ Theme</button>
  </div>

raft", "ver": "v1.0", "owner": "Geospatial / Tech Manager", "cluster": "INFRA"}, {"id": "TEC-007", "title": "n8n Automation Governance & Change Log (retired — see TEC-003)", "domain": "TEC", "tier": "P2", "status": "Retired", "ver": "v1.1 (retired)", "owner": "Geospatial / Tech Manager", "cluster": "AUTO"}, {"id": "TEC-008", "title": "Zoom Meeting Setup, Recording & Archival", "domain": "TEC", "tier": "P3", "status": "Registered", "ver": null, "owner": "Tech Mgr", "cluster": "COMMS"}, {"id": "TEC-009", "title": "Outlook / M365 Mail & Calendar Administration", "domain": "TEC", "tier": "P2", "status": "Draft", "ver": "v1.0", "owner": "Geospatial / Tech Manager", "cluster": "COMMS"}, {"id": "CX-001", "title": "Final Walk-Through & Client Sign-off", "domain": "CX", "tier": "P1", "status": "Draft", "ver": "v1.0", "owner": "Operations Manager", "cluster": null}, {"id": "CX-002", "title": "Warranty Registration & Claims", "domain": "CX", "tier": "P2", "status": "Registered", "ver": null, "owner": "Ops Manager", "cluster": null}, {"id": "CX-003", "title": "Review & Referral Solicitation", "domain": "CX", "tier": "P2", "status": "Registered", "ver": null, "owner": "Ops Manager", "cluster": null}, {"id": "CX-004", "title": "Post-Project Follow-up Cadence", "domain": "CX", "tier": "P3", "status": "Registered", "ver": null, "owner": "Ops Manager", "cluster": null}, {"id": "HR-001", "title": "Role Definition & Job Descriptions", "domain": "HR", "tier": "P3", "status": "Registered", "ver": null, "owner": "Principal", "cluster": null}, {"id": "HR-002", "title": "Recruiting & Interview Rubric", "domain": "HR", "tier": "P2", "status": "Registered", "ver": null, "owner": "Principal", "cluster": null}, {"id": "HR-003", "title": "New Hire Onboarding", "domain": "HR", "tier": "P2", "status": "Registered", "ver": null, "owner": "Principal", "cluster": null}, {"id": "HR-004", "title": "Employment Classification (W2/1099) Review", "domain": "HR", "tier": "P1", "status": "Draft", "ver": "v1.0", "owner": "Principal", "cluster": null}], "content": {"CON-001": "# SOP-CON-001 · Deposit Processing & Contract Execution\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-004, DES-005, DES-006, CON-002, CON-004, PRO-001, FIN-001, SAF-005 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n> **Not legal advice.** CA statutory figures below must be verified with counsel / current CSLB guidance before Effective date.\n\n## Purpose\nConvert an accepted proposal (DES-006) into a **fully executed, CA-compliant contract** with deposit collected within statutory limits — establishing the legal and financial basis to begin, and triggering the HOA clock (CON-002) and production handoff (PRO-001).\n\n## Scope / Trigger\nFires when the client accepts the proposal (DES-006). Covers contract assembly, CA compliance check, signature, deposit collection, and downstream triggers. Ends when funds clear and CON-002 + PRO-001 are triggered. Does **not** cover mid-project changes (CON-004) or milestone billing (FIN-001).\n\n## Roles (RACI-lite)\n- **Responsible:** Operations Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Principal (non-standard terms); counsel (contract template/legal questions)\n- **Informed:** Design Lead (scope lock), Production Lead (incoming handoff)\n\n## Systems & Inputs\n- **Contractor Foreman** — contract, deposit ledger, project record.\n- **M365 / e-sign** — signature capture.\n- **Dropbox** — executed docs filed per TEC-002.\n- Approved proposal (DES-006), itemized estimate (DES-005), plans (DES-004), milestone schedule (FIN-001).\n\n## Procedure\n1. **Assemble contract** from the approved proposal: scope + itemized estimate (DES-005), plans (DES-004), milestone payment schedule (FIN-001), start/timeline, and all CA-mandatory home-improvement notices. → *Output: draft contract.*\n2. **Compliance check** — contract carries required CA home-improvement notices (incl. buyer's right-to-cancel / Notice of Cancellation), CSLB license # and required disclosures, and the **deposit does not exceed the statutory home-improvement cap — [lesser of $1,000 or 10% of contract price; verify current CSLB figure]**. → *Output: compliance-passed contract.*\n3. **Send for signature** via e-sign; capture the fully executed copy. → *Output: signed contract.*\n4. **Collect deposit** within the cap; **issue receipt**; log to the Contractor Foreman deposit ledger. → *Output: receipted deposit.*\n5. **Confirm funds** cleared before any downstream trigger. → *Output: cleared-funds confirmation.*\n6. **Trigger + file** — start CON-002 (HOA 3–4 day clock) and PRO-001 (production handoff); file executed contract + receipt + locked estimate/plans together in the Dropbox project folder. → *Output: triggers fired, docs versioned.*\n\n## Acceptance Criteria / QC\n**No work is scheduled and no deposit above the statutory cap is collected without a fully executed, compliant contract.** Concretely:\n- Signed contract contains all CA-mandatory notices, license #, disclosures.\n- Deposit within statutory cap and receipted.\n- Funds-cleared confirmation logged.\n- Contract + estimate (DES-005) + plans (DES-004) versioned together in Dropbox.\n- CON-002 and PRO-001 triggered.\n\n## Exceptions & Escalation\n- **Client wants to prepay above cap** → not permitted; explain statutory limit, structure via milestone schedule (FIN-001).\n- **Financing involved** → route to Principal for financed-contract handling.\n- **Scope change during signing** → re-issue through DES-005/DES-006; never hand-edit an assembled contract.\n- **Non-standard terms / legal questions** → Principal + counsel before signature.\n\n## Outputs\nExecuted contract + receipted deposit → Dropbox + Contractor Foreman. Triggers **CON-002** (HOA), **PRO-001** (production handoff), **FIN-001** (milestone billing).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial. CA-compliance gate incl. statutory down-payment cap (verify); scope-locked contract assembled from DES-004/005/006; triggers CON-002 + PRO-001 on cleared funds. |\n", "CON-002": "# SOP-CON-002 · HOA Submission Package\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-001, DES-004, CON-001, CON-004, PRO-001, PRO-002 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nAssemble and submit a complete HOA architectural-review package **within 3–4 business days of cleared deposit** (flyer promise), so the external approval clock — usually the project's longest dependency — starts as early as possible and doesn't bottleneck the build.\n\n## Scope / Trigger\nFires on the CON-001 trigger when the DES-001 HOA flag = present. Covers requirement gathering, package assembly, CC&R pre-check, submission, approval tracking, and revision cycles. Ends when approval is filed and Production is notified. If DES-001 flagged **no HOA**, record \"N/A\" and close — this SOP is skipped.\n\n## Roles (RACI-lite)\n- **Responsible:** Operations Manager\n- **Accountable:** Operations Manager\n- **Consulted:** Design Lead (plan revisions), Client (owner-submitted forms / signatures)\n- **Informed:** Production Lead (schedule gating)\n\n## Systems & Inputs\n- **Dropbox** — package assembly + approval records per TEC-002.\n- HOA architectural form + CC&R guidelines; plans/renderings (DES-004); site plan, material/color specs, drainage plan (DES-001); license + insurance (SAF-005).\n\n## Procedure\n1. **Confirm requirements** — from the DES-001 HOA flag, obtain the specific HOA's architectural submission form and CC&R guidelines. → *Output: requirements checklist.*\n2. **Assemble package** — application, site plan, renderings (DES-004), material/color specs, dimensions + setbacks, drainage plan, contractor license/insurance. → *Output: draft package.*\n3. **CC&R pre-check** — validate against guideline restrictions (setbacks, height, materials, coverage) to catch rejections *before* submitting. → *Output: pre-checked package.*\n4. **Client review / signature** where the HOA requires owner submission. → *Output: signature-ready package.*\n5. **Submit within [3–4 business days]** of cleared deposit (CON-001); log submission date, method, and the HOA's stated review window. → *Output: submission record.*\n6. **Track approval** — calendar the review window; follow up at **[7-day]** intervals if silent. → *Output: approval tracker.*\n7. **Handle conditions/revisions** — route required changes back to DES-004, resubmit, log the cycle. → *Output: revised submission (if any).*\n8. **On approval** — file the approval document in Dropbox; notify Production Lead that HOA-gated scope may be scheduled (PRO-002). → *Output: filed approval + Production notice.*\n\n## Acceptance Criteria / QC\n**Package submitted within 3–4 business days of cleared deposit, complete and CC&R-pre-checked; approval tracked to closure; approval filed before any HOA-gated work is scheduled.** Concretely:\n- Submission date + expected-decision date logged.\n- Package pre-checked against CC&Rs (no avoidable rejections).\n- Approval document filed in the project folder.\n- Production notified only after approval for HOA-gated scope.\n\n## Exceptions & Escalation\n- **Missing info the HOA requires** → targeted DES-001 return capture; don't submit incomplete.\n- **HOA denial** → revise via DES-004 and resubmit, or convert to scope change (CON-004).\n- **HOA non-responsive past its stated window** → Ops Manager escalates to HOA board / management company.\n- **Repeated denials** → Principal + Design Lead for redesign.\n\n## Outputs\nSubmitted HOA package, approval tracker, filed approval → Dropbox. Gates schedule finalization in **PRO-002**; revisions loop through **DES-004** / **CON-004**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial. 3–4 business-day submission SLA off cleared deposit; CC&R pre-check to pre-empt rejections; approval gates HOA-scope scheduling. |\n", "CON-004": "# SOP-CON-004 · Change Order Authorization\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-004, DES-005, CON-001, CON-002, PRO-005, FIN-001, FIN-003 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nControl every mid-project scope change so it is **priced, margin-applied, and client-authorized in writing before the changed work proceeds** — preventing scope creep, margin erosion, and disputes.\n\n## Scope / Trigger\nFires on any deviation from the executed contract scope (CON-001): client-requested change, unforeseen site condition (subgrade, drainage, utilities), HOA-required revision (CON-002), or material substitution/availability. Ends when the signed change order (CO) is filed and the contract sum/schedule updated.\n\n## Roles (RACI-lite)\n- **Responsible:** Operations Manager (or Production Lead for field-originated conditions)\n- **Accountable:** Operations Manager\n- **Consulted:** Design Lead (design impact/re-pricing), Production Lead (constructability/schedule), Client (authorization)\n- **Informed:** Principal (margin/feasibility threshold breaches)\n\n## Systems & Inputs\n- **Contractor Foreman** — CO log, contract sum, schedule.\n- **Dropbox** — signed COs filed per TEC-002.\n- Executed contract (CON-001), current plans (DES-004), estimate method (DES-005).\n\n## Procedure\n1. **Log the request** in Contractor Foreman the moment it arises (source + description); **pause affected work** if it can't proceed correctly/safely without resolution. → *Output: CO record.*\n2. **Assess impact** — mini-takeoff per DES-005 method (materials, labor, subs) plus schedule delta; apply **target margin**. → *Output: priced CO with schedule impact.*\n3. **Present to client** — itemized cost, schedule shift, and revised contract total. → *Output: CO document.*\n4. **Obtain written authorization** (signature / e-sign) **before performing changed work. No verbal changes.** → *Output: signed CO.*\n5. **Collect payment** per CO terms within the milestone structure (FIN-001). → *Output: CO payment logged.*\n6. **Update records** — adjust contract sum + schedule in Contractor Foreman; revise plans (DES-004) if design changed; file the signed CO in Dropbox. → *Output: updated project record.*\n\n## Acceptance Criteria / QC\n**No changed work is performed on a verbal or unsigned change.** Concretely:\n- Every change captured as a CO before work proceeds.\n- CO priced with target margin applied.\n- Client written authorization obtained pre-work.\n- Contract sum + schedule updated in Contractor Foreman.\n- Signed CO filed in the project folder; plans revised if applicable.\n\n## Exceptions & Escalation\n- **Emergency / safety condition** requiring immediate action → act to make safe, document immediately, notify client, and ratify the CO retroactively **same day**.\n- **Trivial, no-cost clarification** → note in the project log; no CO required.\n- **Client disputes an unforeseen-condition CO** → Ops Manager + Principal.\n- **CO drops project below margin/feasibility** → Principal decision before proceeding.\n\n## Outputs\nSigned change order, updated contract sum + schedule, revised plans → Dropbox + Contractor Foreman. Feeds **FIN-001** (billing) and **FIN-003** (job-cost reconciliation).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial. Written-authorization-before-work gate; DES-005 mini-takeoff pricing with margin; same-day retroactive ratification path for emergencies. |\n", "CX-001": "# SOP-CX-001 · Final Walk-Through & Client Sign-off\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | PRO-006, FLD-002, FLD-003, FIN-001, CX-002, CX-003, CON-004 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nClose the project with the client on-site (flyer step 7 — \"we review the completed property together\"): confirm the work matches the contracted scope, clear the punch list, collect final payment, and hand off warranty — converting a finished build into a signed-off, paid, referral-ready project.\n\n## Scope / Trigger\nFires when PRO-006 marks construction complete and the punch list is ready. Covers the joint walk-through, punch resolution, sign-off, final billing, and warranty/referral handoff. Ends when the project is signed off, paid, and warranty-registered.\n\n## Roles (RACI-lite)\n- **Responsible:** Operations Manager (or Production Lead)\n- **Accountable:** Operations Manager\n- **Consulted:** Production Lead (punch items), Client (acceptance)\n- **Informed:** Principal (disputes), Design Lead (design-intent questions)\n\n## Systems & Inputs\n- **Contractor Foreman** — punch list, final invoice (FIN-001).\n- **Dropbox** — signed acceptance + warranty docs per TEC-002.\n- Completed project + punch list (PRO-006), as-built photo records (FLD-002/003), milestone schedule (FIN-001).\n\n## Procedure\n1. **Pre-walk prep** — confirm punch list (PRO-006) and that all contracted + change-order (CON-004) scope is complete; assemble as-built photos and warranty docs. → *Output: walk-ready package.*\n2. **Joint walk-through** — review the completed property with the client against contracted scope + plans (DES-004); capture any client-noted items. → *Output: walk punch list.*\n3. **Resolve punch** — complete outstanding items; re-walk contested items. → *Output: cleared punch list.*\n4. **Obtain sign-off** — client signs a completion/acceptance form confirming scope complete and accepted. → *Output: signed acceptance.*\n5. **Final billing** — issue the final milestone invoice (FIN-001); collect balance. → *Output: final payment.*\n6. **Warranty handoff** — register/issue warranty and care instructions (esp. planting/turf/irrigation + hardscape); log in CX-002. → *Output: warranty registered.*\n7. **Referral/review ask** — trigger CX-003 while satisfaction is highest. → *Output: review/referral request sent.*\n\n## Acceptance Criteria / QC\n**A project is not closed until it is signed off, paid, and warranty-registered.** Concretely:\n- All contracted + change-order scope verified complete.\n- Punch list cleared (or remaining items documented + agreed).\n- Client signed the acceptance form.\n- Final invoice issued and balance collected (FIN-001).\n- Warranty registered (CX-002); care instructions delivered.\n- Referral/review request triggered (CX-003).\n\n## Exceptions & Escalation\n- **Client disputes completeness** → document specific items; Production Lead resolves; unresolved → Principal. Do not force sign-off.\n- **Client withholds final payment** → Operations Manager + Principal; reference contract/lien remedies (counsel).\n- **Latent issue surfaces at walk** → log to warranty (CX-002) or correct pre-sign-off depending on severity.\n\n## Outputs\nSigned acceptance, final payment, registered warranty, referral request → Dropbox + Contractor Foreman. Feeds **CX-002** (warranty), **CX-003** (referral), **FIN-003** (final job-cost reconciliation).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial. Signed-off + paid + warranty-registered closeout gate; joint walk against contracted scope; referral trigger at peak satisfaction. |\n", "DES-001": "# SOP-DES-001 · Initial Consultation & Site Assessment\n\n| Field | Value |\n|-------|-------|\n| Owner | Design Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | SAL-003, SAL-005, DES-002, DES-004, DES-005, CON-002, FLD-002, TEC-002 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nCapture, in a **single site visit**, everything required to produce renderings (DES-004) and an itemized estimate (DES-005) within the flyer's **5–7 day** SLA — without a return trip. This SOP is the data-integrity gate for the entire design phase; an incomplete assessment breaks the SLA downstream.\n\n## Scope / Trigger\nFires when SAL-003 confirms a consultation appointment. Covers the goals interview, full site measurement, conditions/drainage survey, photo documentation, HOA determination, and the drone-survey decision. Ends when the project record exists and the design clock starts.\n\n## Roles (RACI-lite)\n- **Responsible:** Design Lead\n- **Accountable:** Design Lead\n- **Consulted:** Client (goals, budget, style); Geospatial/Tech Manager (if drone survey triggered, DES-002)\n- **Informed:** Sales Lead (handoff close-out); Production Lead (early feasibility flags)\n\n## Systems & Inputs\n- **Contractor Foreman** — project record of truth.\n- **Dropbox** — project folder per TEC-002 naming/PARA structure.\n- **Measurement kit** (tape/laser/wheel); camera; DJI Air 2S + GCP kit on standby for DES-002.\n- Qualified lead + notes from SAL-002/SAL-003.\n\n## Procedure\n1. **Pre-visit prep** — review SalesRabbit lead + qualification notes; pull parcel/plot plan if obtainable; reconfirm appointment. → *Output: prep brief.*\n2. **Goals interview** — capture priorities, must-haves vs. nice-to-haves, style/inspiration, and **confirm budget band** from SAL-002 (reset expectations if misaligned). → *Output: design brief draft.*\n3. **Site measurement + conditions survey** — work-area dimensions, existing hardscape/structures, setbacks/easements, utilities (water, electrical, gas for firepits), irrigation, equipment access, staging/disposal. → *Output: field measurements + annotated site sketch.*\n4. **Drainage + grade assessment** — slope, low points, runoff paths, downspouts, existing pooling. This is the flyer differentiator and the top callback risk. → *Output: drainage notes (feeds FLD-002 + design).*\n5. **Photo documentation** — standard set: every elevation, all problem areas, access route, tie-in points. → *Output: photo set in Dropbox project folder.*\n6. **HOA determination** — presence + architectural submission requirements. → *Output: HOA flag + requirements (feeds CON-002).*\n7. **Drone-survey decision gate** — trigger **DES-002** if: large/complex lot, significant grade change, 3D model required for design, or access limits manual measurement. Else manual capture is sufficient — record the decision. → *Output: DES-002 trigger or \"manual sufficient\" note.*\n8. **Create + start clock** — open the Contractor Foreman project record; upload all captured data to the Dropbox project folder (TEC-002); **start the 5–7 day design clock** with a due date. → *Output: CF project + design due date.*\n\n## Acceptance Criteria / QC\n**The assessment is complete only if DES-004 and DES-005 can start without a return visit.** Concretely:\n- Design brief complete: goals, confirmed budget band, in/out-of-scope.\n- Full measurement set + site sketch.\n- Drainage assessed and documented.\n- Standard photo set uploaded to the correct Dropbox path.\n- HOA status determined.\n- Contractor Foreman project created; design clock started with due date.\n- Drone decision recorded (triggered or waived).\n\n## Exceptions & Escalation\n- **Inaccessible / locked areas** → schedule brief return or guided client self-capture; do not guess measurements.\n- **Scope beyond current capability** → Principal.\n- **Survey-grade accuracy required** → DES-002 (drone/GCP) before design proceeds.\n- **Budget misalignment surfaced on-site** → reset with client; if unrecoverable, disposition back through SAL with reason.\n\n## Outputs\nDesign brief, measured site data, drainage notes, photo set, HOA flag → Dropbox project folder + Contractor Foreman. Conditionally triggers **DES-002**, then feeds **DES-004** (renderings) and **DES-005** (estimate).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Design Lead | Initial. Single-visit capture checklist gated on \"design + estimate can start without return visit\"; drone decision gate; 5–7 day clock start. |\n", "DES-004": "# SOP-DES-004 · 2D/3D Rendering Production\n\n| Field | Value |\n|-------|-------|\n| Owner | Design Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-001, DES-002, DES-003, DES-005, DES-006, CON-002, FLD-002, TEC-002, TEC-005 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nProduce client-ready 2D/3D renderings within the **5–7 day** SLA from site assessment (DES-001), accurately representing a **buildable** design so they anchor the estimate (DES-005) and proposal (DES-006). This is the flyer's \"Visual Confidence\" differentiator and the design phase's SLA engine.\n\n## Scope / Trigger\nFires on the DES-001 handoff (design clock already started). Covers base-model build, design, render production, internal constructability review, delivery, and bounded revisions. Ends with an approved design package feeding DES-005/DES-006. Excludes takeoff/pricing (DES-005) and drone capture (DES-002).\n\n## Roles (RACI-lite)\n- **Responsible:** Design Lead\n- **Accountable:** Design Lead\n- **Consulted:** Production Lead (constructability), Geospatial/Tech Manager (photogrammetry asset import, TEC-005)\n- **Informed:** Operations Manager (SLA status), Client (delivery)\n\n## Systems & Inputs\n- **Realtime Landscaping** — rendering.\n- **3D asset pipeline (TEC-005)** — RealityScan/Blender imports where DES-002/003 ran.\n- **Dropbox** — asset storage per TEC-002.\n- Design brief + measurements + drainage notes (DES-001); optional photogrammetry model (DES-002/003); HOA/setback flags (DES-001/CON-002).\n\n## Procedure\n1. **Verify inputs** complete (DES-001 brief/measurements/drainage; DES-002/003 model if triggered). **Don't start on incomplete data** — the SLA depends on it. → *Output: verified inputs.*\n2. **Build the base model** to the measured site (scale-accurate); import geospatial/photogrammetry assets via TEC-005 if present. → *Output: base model.*\n3. **Design to brief** — hardscape, structures, planting, water features — respecting setbacks/HOA constraints (DES-001/CON-002) and the drainage strategy (FLD-002). → *Output: design draft.*\n4. **Produce renders** — 2D plan + 3D standard view set (overview + key vantage points). → *Output: render set.*\n5. **Internal constructability review** — Design Lead + Production input **before** the client sees it; verify buildability and rough alignment with the coming estimate. → *Output: reviewed renders.*\n6. **Deliver within the 5–7 day SLA**; handle bounded client revision rounds (**[2]** included; further rounds via scope/CO conversation). → *Output: delivered renders.*\n7. **Finalize** the approved design; release to DES-005 (takeoff) + DES-006 (proposal); file assets in Dropbox. → *Output: approved design package.*\n\n## Acceptance Criteria / QC\n**No render reaches the client that hasn't passed constructability review — the picture must be buildable and estimatable.** Concretely:\n- Renders delivered within 5–7 days of the DES-001 clock start.\n- Scale-accurate to the measured site.\n- Setbacks / HOA / drainage respected (no un-permittable or undrainable promises).\n- Internal constructability review passed before client delivery.\n- Revision rounds bounded per policy.\n\n## Exceptions & Escalation\n- **Incomplete inputs** → bounce to DES-001; flag SLA risk.\n- **Complex model requiring survey-grade capture** → confirm DES-002 done before designing.\n- **Excess revision rounds** → scope/CO conversation (CON-004).\n- **SLA at risk** → Design Lead / Operations Manager for resourcing or client expectation reset.\n- **Design vs. constructability conflict** → Production Lead resolves before delivery.\n\n## Outputs\nApproved 2D/3D render set → **DES-005** (takeoff), **DES-006** (proposal); assets filed in Dropbox (TEC-002).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Design Lead | Initial. 5–7 day SLA render production; scale-accurate base model + TEC-005 asset import; constructability-review-before-client gate; bounded revision rounds. |\n", "DES-005": "# SOP-DES-005 · Takeoff & Itemized Estimate Build\n\n| Field | Value |\n|-------|-------|\n| Owner | Design Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-001, DES-004, DES-006, PRC-001, PRC-002, CON-001, CON-003, FIN-001, FIN-003 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nTurn an approved design + site data into a complete, **margin-protected**, itemized estimate structured for client comparison and mapped to a milestone payment schedule. Delivers on the flyer promise of \"detailed, itemized estimates and an organized payment structure.\"\n\n## Scope / Trigger\nFires when DES-004 renderings are internally approved and DES-001 site data is complete. Covers quantity takeoff, pricing, sub scopes, fees, margin application, and estimate structuring. Ends when a margin-checked estimate is ready for DES-006 (proposal). Does **not** cover proposal presentation (DES-006) or contract (CON-001).\n\n## Roles (RACI-lite)\n- **Responsible:** Design Lead / Estimator\n- **Accountable:** Design Lead\n- **Consulted:** Production Lead (constructability, labor hours); subs (specialty quotes)\n- **Informed:** Operations Manager / Principal (margin approval gate)\n\n## Systems & Inputs\n- **Contractor Foreman** — estimate build + payment schedule.\n- **PRC-001 Approved Supplier List** — SiteOne (hardscape/irrigation), nurseries (plant material).\n- Approved design (DES-004), measured site + drainage data (DES-001), HOA/permit requirements (CON-002/CON-003).\n\n## Procedure\n1. **Input gate** — confirm approved design, complete site + drainage data, and HOA/permit requirements are in hand. **Do not estimate on incomplete data** — bounce to DES-001/DES-004 if gaps exist. → *Output: verified input set.*\n2. **Quantity takeoff** by category from design + measurements: hardscape SF + base, paver/unit counts, drainage components, pool/spa allowances, planting counts, turf SF, irrigation zones, structures. → *Output: takeoff sheet.*\n3. **Price materials** against **PRC-001** approved suppliers; flag volatile-price and long-lead items. **No guessed pricing.** → *Output: priced materials.*\n4. **Labor + equipment** estimate by phase (excavation, base, install, planting), consulting Production Lead on hours. Include rentals. → *Output: labor/equipment lines.*\n5. **Subcontractor scopes** — solicit quotes (pool, electrical, gas, specialty) or apply time-boxed allowances where quotes aren't yet available. → *Output: sub line items (quoted or allowance-flagged).*\n6. **Fees** — permit (CON-003), HOA, disposal/dump, inspections. → *Output: fee lines.*\n7. **Margin + contingency** — apply overhead and **target gross margin ≥ [__%]**; add a contingency/allowance line sized to subgrade/drainage uncertainty. → *Output: internal cost sheet with margin check.*\n8. **Structure client-facing estimate** — itemize by phase/category with **alternates/options** so the client can compare scopes (flyer intent); map totals to a **milestone payment schedule** (feeds FIN-001). → *Output: itemized estimate + payment schedule.*\n9. **Approval gate** — Ops Manager/Principal sign-off if total > **[$ threshold]** or GM \u003c target. Log approval. → *Output: approved estimate.*\n10. **Release** to DES-006 for proposal assembly.\n\n## Acceptance Criteria / QC\n**No estimate leaves without a margin check.** Concretely:\n- Every design element maps to at least one estimate line (no unpriced scope).\n- All materials priced against PRC-001 suppliers — zero guessed prices.\n- Target GM met, or exception explicitly approved and logged.\n- Contingency line present.\n- Client-facing estimate itemized with alternates; payment schedule maps to defined milestones.\n- Internal approval recorded where thresholds trigger it.\n\n## Exceptions & Escalation\n- **GM below target** → Principal approval required to proceed.\n- **High-uncertainty scope** → convert to a clearly labeled allowance; note assumption to client via DES-006.\n- **Sub quote unavailable in time** → time-boxed allowance, flagged as provisional.\n- **Material price spike / long lead** → note validity window on the estimate; re-price if signed past window.\n\n## Outputs\nInternal margin-checked cost sheet + client-facing itemized estimate + milestone payment schedule → feeds **DES-006** (proposal). On win: **CON-001** (contract) and **FIN-001** (billing); actuals reconcile against **FIN-003** (job costing).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Design Lead | Initial. Input-gated takeoff; PRC-001 pricing (no guesses); mandatory margin check + approval gate; itemized-with-alternates output mapped to milestone billing. |\n", "DES-006": "# SOP-DES-006 · Proposal Assembly & Delivery\n\n| Field | Value |\n|-------|-------|\n| Owner | Design Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-004, DES-005, FIN-001, CON-001, CON-004, SAL-004 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nAssemble the renders (DES-004), itemized estimate (DES-005), and payment schedule (FIN-001) into one client-facing proposal that presents the design with confidence, lets the client compare options, and drives a decision — the conversion artifact that, on acceptance, triggers CON-001.\n\n## Scope / Trigger\nFires when DES-004 renders are approved and DES-005 estimate is margin-checked. Covers proposal assembly, internal review, delivery/presentation, and disposition. Ends by triggering CON-001 (accept) or a coded close/nurture (decline/stall).\n\n## Roles (RACI-lite)\n- **Responsible:** Design Lead\n- **Accountable:** Design Lead\n- **Consulted:** Operations Manager (terms/margin), Sales Lead (close)\n- **Informed:** Client, Principal (non-standard deals)\n\n## Systems & Inputs\n- **Contractor Foreman** — proposal build.\n- Approved renders (DES-004), margin-checked estimate (DES-005), payment schedule (FIN-001).\n\n## Procedure\n1. **Input gate** — confirm approved renders, margin-checked estimate, and payment schedule are all present and internally approved. → *Output: verified inputs.*\n2. **Assemble proposal** — brand cover, design renders, itemized scope **with alternates/options**, payment schedule, construction timeline, the 7-step process, and terms summary. → *Output: proposal draft.*\n3. **Internal review** — pricing/margin, scope accuracy vs. renders, no un-permittable/undrainable promises. → *Output: reviewed proposal.*\n4. **Deliver + present** (M365 / meeting); walk the client through options. → *Output: delivered proposal.*\n5. **Handle Q&A + options** — minor changes within scope; material changes loop back to DES-004/DES-005. → *Output: client feedback.*\n6. **Disposition** — **accept → trigger CON-001**; stall → nurture/follow-up cadence; decline → reason-coded close (feeds SAL-004). → *Output: disposition.*\n\n## Acceptance Criteria / QC\n**No proposal goes out missing renders, itemized pricing, or the payment schedule — the client can compare and decide from one document.** Concretely:\n- Proposal contains renders + itemized estimate (with alternates) + payment schedule + timeline + process.\n- Internally reviewed for margin and scope-vs-render accuracy.\n- Delivered/presented to the client.\n- Outcome dispositioned (accept/stall/decline) with reason.\n\n## Exceptions & Escalation\n- **Material scope change requested** → loop to DES-004/DES-005; re-issue, don't hand-edit.\n- **Non-standard terms/discount** → Principal.\n- **Stalled past [14 days]** → Sales Lead nurture; revisit pricing validity window (DES-005).\n\n## Outputs\nClient-facing proposal → on acceptance triggers **CON-001** (contract/deposit); decline data → **SAL-004**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Design Lead | Initial. Single-document proposal (renders + itemized estimate + payment schedule + timeline/process); input gate + internal review; acceptance triggers CON-001. |\n", "FIN-001": "# SOP-FIN-001 · Payment Schedule & Milestone Billing\n\n| Field | Value |\n|-------|-------|\n| Owner | Admin / Finance |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-005, CON-001, CON-004, PRO-002, PRO-005, PRO-006, FIN-002, FIN-003, CX-001 |\n\n> Bracketed values `[…]` are proposed defaults. **Not legal advice** — CA payment-structure rules below must be verified with counsel / current CSLB guidance before Effective date.\n\n## Purpose\nDefine a contract-embedded, **CA-compliant** milestone payment schedule (schedule of values) that maps to production phases and drives invoicing (FIN-002). Delivers the flyer's \"organized payment structure\" while keeping each draw within legal limits.\n\n## Scope / Trigger\nFires during DES-005/DES-006 (schedule built into the proposal) and locks at CON-001 (embedded in the executed contract). Adjusted on CON-004. Releases billing triggers to FIN-002 through the build. Covers structure and release triggers — not invoice issuance (FIN-002).\n\n## Roles (RACI-lite)\n- **Responsible:** Admin / Finance\n- **Accountable:** Operations Manager\n- **Consulted:** Design Lead (SOV allocation), Principal (non-standard structures), counsel (compliance)\n- **Informed:** Production Lead (milestone triggers), Client (schedule at signing)\n\n## Compliance guardrails (verify with counsel)\n| Rule | Constraint |\n|------|-----------|\n| Down payment | **≤ lesser of $1,000 or 10%** of contract price (CON-001) |\n| Progress payments | **Each draw ≤ value of work performed + materials delivered** to date — no billing ahead of work |\n| Special-order materials | May be billable on delivery **[verify permitted structure]** |\n| Final payment | Due on completion / acceptance (CX-001) |\n\n## Procedure\n1. **Build the schedule of values** — allocate the contract sum (from DES-005) across phases/milestones. → *Output: SOV.*\n2. **Set the deposit** within the statutory cap (CON-001). → *Output: compliant deposit line.*\n3. **Structure draws** so each milestone bills **no more than the value of work performed** at that point; tie each to a **verifiable completion trigger** (phase complete per PRO-002 + PRO-005, inspection pass). → *Output: triggered draw schedule.*\n4. **Embed in contract** (CON-001) before signature; present to client. → *Output: contracted payment schedule.*\n5. **Adjust on change** — reflect CON-004 change orders in the SOV + contract sum. → *Output: updated schedule.*\n6. **Release milestones** to FIN-002 for invoicing only when the completion trigger is verified (PRO-005 / PRO-006). → *Output: billing releases.*\n\n## Acceptance Criteria / QC\n**No draw is billed before its work is verifiably complete, and no draw exceeds the value of work performed.** Concretely:\n- Payment schedule embedded in the contract before signature.\n- Deposit within statutory cap.\n- Each milestone tied to a verifiable completion trigger.\n- CO adjustments reflected in SOV + contract sum.\n- No front-loaded/ahead-of-work billing.\n\n## Exceptions & Escalation\n- **Client requests a front-loaded schedule** → not permitted; explain the statutory limit, keep compliant.\n- **Large special-order material cost** → structure a compliant materials-on-delivery draw (verify with counsel).\n- **Non-standard structure requested** → Principal + counsel.\n\n## Outputs\nSchedule of values / payment schedule → contract (CON-001); verified billing triggers → FIN-002; cost baseline → FIN-003.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Admin/Finance | Initial. Contract-embedded SOV; CA guardrails (deposit cap, draws ≤ work performed); verifiable per-milestone completion triggers. Compliance items flagged for counsel. |\n", "FIN-002": "# SOP-FIN-002 · Invoicing & AR Follow-up\n\n| Field | Value |\n|-------|-------|\n| Owner | Admin / Finance |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | FIN-001, FIN-003, CON-004, PRO-002, CX-001 |\n\n> Bracketed values `[…]` are proposed defaults. **Not legal advice** — CA preliminary-notice / mechanics-lien timing must be verified with counsel before relying on it.\n\n## Purpose\nIssue milestone invoices promptly when FIN-001 triggers fire, track receivables, and work overdue balances on a fixed cadence so collections stay in step with the build — cash never lags materially behind work performed.\n\n## Scope / Trigger\nFires on each verified milestone release from FIN-001 (and the final invoice at CX-001). Covers invoice issuance, AR aging, follow-up, and payment reconciliation. Does **not** set the payment structure (FIN-001) or reconcile job margin (FIN-003).\n\n## Roles (RACI-lite)\n- **Responsible:** Admin / Finance\n- **Accountable:** Operations Manager\n- **Consulted:** Production Lead (milestone verification), Principal + counsel (chronic non-payment / lien)\n- **Informed:** Client (invoices, reminders)\n\n## Systems & Inputs\n- **Contractor Foreman** — invoicing + AR.\n- Milestone releases (FIN-001), completion verification (PRO-005/PRO-006), contract payment terms (CON-001).\n\n## Procedure\n1. **Issue invoice** within **[1 business day]** of a verified milestone release (FIN-001); reference the milestone + SOV line. → *Output: issued invoice.*\n2. **Send + log** to the client POC with due date per contract terms (**[net __ / due on receipt]**). → *Output: sent invoice + due date.*\n3. **Track AR aging** weekly; flag approaching and overdue. → *Output: AR aging report.*\n4. **Follow-up cadence** on overdue — reminder at due, **[+3d]**, **[+7d]**; escalate at **[+14d]**. → *Output: follow-up log.*\n5. **Escalate** past **[14d]** to Operations Manager / Principal; reference contract remedies (stop-work, lien) with counsel — **mind CA preliminary-notice / lien deadlines [verify timing]**. → *Output: escalation record.*\n6. **Reconcile** payments received; update AR; confirm payment before proceeding past any payment-gated milestone the contract defines. → *Output: reconciled ledger.*\n\n## Acceptance Criteria / QC\n**Collections stay in step with work performed; no payment-gated phase proceeds unpaid.** Concretely:\n- Invoice issued within [1 business day] of verified milestone.\n- Every invoice tracked to payment.\n- AR aging reviewed weekly.\n- Overdue worked per cadence; escalations logged.\n- Lien/notice deadlines respected where non-payment escalates.\n\n## Exceptions & Escalation\n- **Disputed invoice** → tie resolution to CX-001 / CON-004; don't let a dispute silently age.\n- **Partial payment** → log + continue following the balance.\n- **Chronic non-payment** → Principal + counsel; preserve lien rights (CA prelim-notice timing — verify).\n\n## Outputs\nInvoices, AR aging, payment reconciliation → Contractor Foreman. Feeds **FIN-003** (job costing) and final reconciliation at **CX-001**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Admin/Finance | Initial. [1-day] issuance off verified milestones; weekly AR aging; tiered overdue cadence with lien-deadline awareness (verify). |\n", "FLD-002": "# SOP-FLD-002 · Drainage & Grading Standards\n\n| Field | Value |\n|-------|-------|\n| Owner | Production Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-001, DES-004, DES-005, FLD-001, FLD-003, PRO-002, CX-001, CX-002 |\n\n> Bracketed values `[…]` are proposed defaults. **All numeric specs must be verified against IRC / local code / manufacturer and the project's engineered plans before Effective date.** Where an engineer's or jurisdiction's spec conflicts, the stamped/permitted plan governs.\n\n## Purpose\nGuarantee positive drainage away from structures and hardscape on every project. This is the flyer's stated differentiator (\"protect foundations, paving, and planting from water damage and settling\") and the **single highest callback/warranty risk** — standardizing it is why FLD-002 is P1 despite being field craft.\n\n## Scope / Trigger\nFires at the grading/drainage phase (after site prep FLD-001, before base/hardscape FLD-003). Covers subgrade grading, surface slope, and drainage-system installation. Governed by the design drainage strategy from DES-001/DES-004. Does **not** cover the paver assembly itself (FLD-003).\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead / crew lead\n- **Accountable:** Production Lead\n- **Consulted:** Design Lead (design intent), civil engineer (where plans are engineered)\n- **Informed:** Operations Manager (inspection/gate status)\n\n## Systems & Inputs\n- Drainage notes + grades (DES-001), plans (DES-004), drainage components from takeoff (DES-005 / PRO-003).\n- Laser level / transit, compaction equipment.\n\n## Specifications (verify before Effective)\n| Item | Target | Governing ref (verify) |\n|------|--------|------------------------|\n| Slope away from foundation | **≥ 6\" fall over first 10 ft (~5%)** | IRC grading @ foundation |\n| Finished hardscape surface slope | **1%–2% (≈ ⅛\"–¼\" per ft)** min positive | ICPI / manufacturer |\n| Subgrade compaction | **[≥ 95% Proctor]**, uniform, no soft spots | Geotech / manufacturer |\n| Drainage discharge | To daylight / approved point; **never onto neighboring property** | Local code / civil |\n| Downspout tie-ins | Captured + routed to drainage system | Plan-specific |\n\n## Procedure\n1. **Verify design + code** — confirm the drainage strategy (DES-004) and required slopes against local code / engineered plan before moving dirt. → *Output: confirmed grade plan.*\n2. **Rough grade subgrade** to design contours; establish continuous positive fall away from all structures per spec. → *Output: rough-graded subgrade.*\n3. **Compact subgrade** to spec; correct soft spots (over-excavate + replace/compact). → *Output: compacted subgrade.*\n4. **Install drainage system** per plan — French drains, channel/trench drains, catch basins, downspout tie-ins; maintain pipe fall to daylight/approved discharge. → *Output: installed drainage.*\n5. **Verify discharge** routes to an approved point and not onto adjacent property. → *Output: verified discharge path.*\n6. **Confirm finish grade + slope** with laser/transit across the whole surface before base goes in (FLD-003). → *Output: grade-verified surface + photo record.*\n7. **Water test** where feasible (hose/observed rain) on drainage-critical areas; confirm no ponding, correct flow. → *Output: drainage test record.*\n\n## Acceptance Criteria / QC\n**No base or hardscape is placed until grade and drainage are verified and documented.** Concretely:\n- Positive slope away from structures meets spec across the entire area (laser-verified).\n- Subgrade compaction meets spec; no soft spots.\n- Drainage system installed to plan with continuous fall to an approved discharge — not onto neighboring property.\n- Downspouts captured.\n- Grade + drainage photographed; water test logged where feasible.\n- Any required inspection passed (PRO-002 hold point).\n\n## Exceptions & Escalation\n- **Field conditions conflict with design slope** (e.g., insufficient fall available) → stop; Design Lead + engineer for a revised drainage solution (may trigger CON-004).\n- **Unsuitable/expansive soils** discovered → geotech consult; document as unforeseen condition (CON-004).\n- **Discharge point dispute / no legal outlet** → Operations Manager + Principal before proceeding.\n\n## Outputs\nVerified grade + installed/tested drainage + photo and test records → Dropbox project folder. Releases **FLD-003** (base/hardscape); records feed **CX-001** sign-off and **CX-002** warranty baseline.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Production Lead | Initial. Spec-driven positive-drainage standard (foundation fall, surface slope, compaction, discharge legality); grade/drainage verification gate before base; water-test record. Specs flagged for code/engineer verification. |\n", "FLD-003": "# SOP-FLD-003 · Hardscape / Paver Installation Standards\n\n| Field | Value |\n|-------|-------|\n| Owner | Production Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | FLD-001, FLD-002, DES-004, DES-005, PRO-002, PRO-003, CX-001, CX-002 |\n\n> Bracketed values `[…]` are proposed defaults aligned to **ICPI** segmental-paving guidance. **Verify all dimensions against ICPI current tech specs, the paver manufacturer, engineered plans, and local code before Effective date.** For vehicular/structural applications, the engineered section governs.\n\n## Purpose\nStandardize segmental paver / hardscape installation to a durable, warranty-defensible assembly — correct base, bedding, edge restraint, and jointing — so surfaces don't settle, spread, or heave. Second-highest callback risk after drainage (FLD-002).\n\n## Scope / Trigger\nFires after FLD-002 grade/drainage verification. Covers base construction through final jointing and compaction for pedestrian and light-vehicular segmental paving. Excludes drainage/grading (FLD-002) and poured structural concrete (separate SOP / sub scope).\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead / crew lead\n- **Accountable:** Production Lead\n- **Consulted:** Design Lead (pattern/layout intent), manufacturer tech (spec edge cases)\n- **Informed:** Operations Manager (QC/inspection status)\n\n## Specifications (verify against ICPI / manufacturer / plan)\n| Item | Pedestrian | Light vehicular | Ref (verify) |\n|------|-----------|-----------------|--------------|\n| Compacted aggregate base | **[4–6\"]** | **[8–12\"]** | ICPI / geotech |\n| Base compaction | ~**[95% Proctor]**, in **[2–4\"]** lifts | same | ICPI |\n| Geotextile over subgrade | Soft/expansive soils | Recommended | ICPI |\n| Bedding layer | **[~1\" (25 mm)]** screeded, **not pre-compacted** | same | ICPI |\n| Edge restraint | **Mandatory**, all open edges | Mandatory | ICPI |\n| Surface slope | Per FLD-002 (**1%–2%**) | Per FLD-002 | ICPI |\n| Joint sand | Polymeric, swept + set per mfr | same | Manufacturer |\n\n## Procedure\n1. **Confirm prerequisite** — FLD-002 grade/drainage verified + documented. Do not start base otherwise. → *Output: prerequisite check.*\n2. **Base construction** — place aggregate to spec depth; compact in lifts to spec; screed to design profile holding FLD-002 slope. → *Output: compacted, screeded base.*\n3. **Geotextile** over subgrade where soils require. → *Output: separation layer (if used).*\n4. **Bedding layer** — screed [~1\"] bedding; **do not compact before laying**. → *Output: screeded bed.*\n5. **Lay pavers** to design pattern (DES-004) off string lines; maintain consistent joints; full units first, cuts last. → *Output: laid field.*\n6. **Edge restraints** — install on all open edges, spiked per manufacturer. → *Output: restrained perimeter.*\n7. **Cuts** — saw-cut clean at borders/penetrations; band as designed. → *Output: finished edges.*\n8. **Compact + joint** — plate-compact with protective mat to seat pavers; sweep joint sand; set polymeric sand per manufacturer (moisture/cure). → *Output: seated, jointed surface.*\n9. **Final QC** — check slope, joint lines, lippage, surface consistency; clean. → *Output: QC-passed surface + photo record.*\n\n## Acceptance Criteria / QC\n**The assembly matches spec at every layer, and the finished surface holds FLD-002 drainage slope with no ponding.** Concretely:\n- Base depth + compaction to spec, in lifts.\n- Bedding screeded to spec, not pre-compacted.\n- Edge restraint on all open edges.\n- Pattern/layout per DES-004; joints consistent; lippage within tolerance.\n- Polymeric joint sand set per manufacturer.\n- Surface slope verified (no ponding); surface photographed.\n\n## Exceptions & Escalation\n- **Base/subgrade fails compaction** → over-excavate + rebuild; if soils are the cause, geotech + CON-004.\n- **Design pattern infeasible with delivered material** → Design Lead; substitution via CON-004 if needed.\n- **Vehicular/structural load beyond standard section** → engineered section required before proceeding.\n\n## Outputs\nCompleted, QC-passed hardscape + photo record → Dropbox project folder. Feeds **CX-001** sign-off and **CX-002** warranty baseline; deviations route to **CON-004**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Production Lead | Initial. ICPI-aligned layered spec (base/bedding/edge restraint/jointing) with pedestrian vs. vehicular sections; FLD-002 prerequisite gate; per-layer acceptance criteria. Dimensions flagged for ICPI/manufacturer/code verification. |\n", "HR-004": "# SOP-HR-004 · Employment Classification (W2 / 1099) Review\n\n| Field | Value |\n|-------|-------|\n| Owner | Principal |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | HR-002, HR-003, SAF-005, PRO-004, FIN-004 |\n\n> Bracketed values `[…]` are proposed defaults. **Not legal advice** — CA classification law (AB5 / ABC test, Labor Code construction-sub provisions) carries significant penalties and **must be verified with employment counsel + CPA** before Effective date.\n\n## Purpose\nCorrectly classify every worker — employee (W2) vs. independent contractor (1099) — under CA law **before engagement**, avoiding misclassification liability (back wages, taxes, penalties).\n\n## Scope / Trigger\nFires before engaging any worker (HR-002/003) or subcontractor (PRO-004), plus periodic re-review on role change. Covers the classification determination and its documentation.\n\n## Roles (RACI-lite)\n- **Responsible:** Principal (or Ops Manager)\n- **Accountable:** Principal\n- **Consulted:** Employment counsel, CPA\n- **Informed:** Admin/Finance (payroll vs. AP), Production Lead (sub engagement)\n\n## Systems & Inputs\n- **Dropbox** — classification records (`02_Areas/HR/`, TEC-002).\n- CA ABC test (AB5) criteria; sub license (SAF-005) + COI + written agreement.\n\n## Classification logic (verify with counsel)\n**CA ABC test — worker is an employee unless ALL of:**\n- **A** — free from control/direction in performing the work;\n- **B** — work is **outside KLR's usual course of business**;\n- **C** — engaged in an independently established trade/business of the same type.\n\n> Practical implication: **core construction labor almost always fails prong B → W2 employee.** Licensed subcontractors operating as separate businesses may qualify differently (see CA construction-subcontractor provisions) — verify per engagement.\n\n## Procedure\n1. **Run the ABC test** before engaging any worker; determine W2 vs. 1099. → *Output: classification determination.*\n2. **Core construction labor → W2** (default); document the rationale; route to HR-003 onboarding. → *Output: W2 record.*\n3. **Licensed subcontractor path** — verify license (SAF-005), COI, and a written sub agreement; classify 1099 **only** if independent-business criteria are met. → *Output: sub classification.*\n4. **Document determination + basis**; retain. → *Output: classification record.*\n5. **Re-review** on role change; annual audit of active classifications. → *Output: audit record.*\n6. **Escalate ambiguous cases** to counsel/CPA **before** engagement. → *Output: cleared determination.*\n\n## Acceptance Criteria / QC\n**No worker is engaged before classification is determined and documented; core construction labor defaults to W2.** Concretely:\n- ABC-test determination made pre-engagement with documented rationale.\n- Core labor classified W2.\n- 1099 used only with verified independent-business criteria + license + COI + written agreement.\n- Determinations retained; annual audit performed.\n\n## Exceptions & Escalation\n- **Ambiguous or borderline case** → counsel/CPA before engaging; do not default to 1099 for convenience.\n- **Existing misclassification discovered** → Principal + counsel for remediation.\n\n## Outputs\nDocumented classification determinations → Dropbox. Gates **HR-003** (onboarding path) and **PRO-004** (sub engagement); informs **FIN-004** (payroll vs. AP) and ties to **SAF-005** (sub credentials).\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Principal | Initial. Pre-engagement ABC-test classification; W2 default for core labor; licensed-sub 1099 path gated on license+COI+agreement. High-liability — flagged for counsel/CPA verification. |\n", "PRC-002": "# SOP-PRC-002 · Material Ordering & PO Process\n\n| Field | Value |\n|-------|-------|\n| Owner | Operations Manager |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | DES-005, PRC-001, PRC-003, PRC-004, PRO-003, CON-004, FIN-003 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nStandardize purchase-order creation, approval, and issuance against the takeoff (DES-005) and approved suppliers (PRC-001) so materials are ordered accurately, cost-controlled, and traceable. This is the **ordering transaction** that PRO-003 schedules against.\n\n## Scope / Trigger\nFires when PRO-003 calls for an order (or long-lead items flagged at PRO-001). Covers PO generation, pricing verification, approval, issuance, tracking, and 3-way match at close. **Distinct from PRO-003** (which owns *timing*) — PRC-002 owns *the PO*.\n\n## Roles (RACI-lite)\n- **Responsible:** Production Lead (raise) / Operations Manager (approve)\n- **Accountable:** Operations Manager\n- **Consulted:** Design Lead (substitutions affecting design)\n- **Informed:** Admin/Finance (job cost, FIN-003)\n\n## Systems & Inputs\n- **Contractor Foreman** — PO creation, approval, tracking.\n- Takeoff (DES-005), materials plan (PRO-003), approved suppliers + pricing (PRC-001).\n\n## Procedure\n1. **Generate PO** from the materials plan (PRO-003) / takeoff (DES-005) — line items, quantities, supplier (PRC-001). → *Output: draft PO.*\n2. **Verify pricing** against current supplier pricing (PRC-001); **flag variance vs. estimate** (feeds FIN-003). → *Output: priced PO.*\n3. **Approval gate** — PO ≤ **[$ threshold]** approved by Production Lead; above → Operations Manager. → *Output: approved PO.*\n4. **Issue** to supplier; confirm receipt + promised delivery date (feeds PRO-003 delivery calendar). → *Output: issued PO.*\n5. **Track to delivery**; on substitution/backorder revise the PO and propagate to PRO-003 (schedule) + CON-004 (if scope/cost changes). → *Output: PO tracker.*\n6. **Close on 3-way match** — PO ↔ receiving record (PRC-004) ↔ supplier invoice; resolve discrepancies before payment. → *Output: reconciled PO.*\n\n## Acceptance Criteria / QC\n**No material is ordered without an approved PO traceable to the takeoff; every PO closes on a 3-way match.** Concretely:\n- Every PO traces to the materials plan / takeoff — no ad-hoc or verbal orders.\n- Priced against PRC-001; variance vs. estimate flagged.\n- Approval gate honored per threshold.\n- 3-way match (PO / receipt / invoice) at close.\n- Changes propagated to PRO-003 + CON-004.\n\n## Exceptions & Escalation\n- **Price variance beyond [tolerance]** → Operations Manager before issuing; may trigger CON-004 / FIN-003 note.\n- **Backorder / substitution** → alternate approved supplier (PRC-001); propagate to schedule.\n- **Receiving discrepancy** → PRC-004 resolution before invoice payment.\n\n## Outputs\nApproved, issued, reconciled POs → Contractor Foreman. Enables **PRO-003** delivery timing; feeds **FIN-003** job costing; receiving via **PRC-004**.\n\n## Revision History\n| Version | Date | Author | Change |\n|---------|------|--------|--------|\n| v1.0 | 2026-08-17 | Ops | Initial (closes the P1 register gap). Takeoff-traceable PO with approval gate + variance flag; 3-way-match close; change propagation to PRO-003/CON-004. |\n", "PRO-001": "# SOP-PRO-001 · Project Kickoff & Handoff to Production\n\n| Field | Value |\n|-------|-------|\n| Owner | Production Lead |\n| Version | v1.0 |\n| Effective | 2026-08-17 |\n| Last reviewed | 2026-08-17 |\n| Next review | 2027-08-17 |\n| Linked SOPs | CON-001, CON-002, CON-003, DES-001, DES-004, DES-005, CON-004, PRO-002, PRO-003, FIN-001 |\n\n> Bracketed values `[…]` are proposed defaults — confirm and lock before Effective date.\n\n## Purpose\nTransfer a signed proj
