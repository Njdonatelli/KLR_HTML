<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base unit, --space-1 through --space-32" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-label);background:var(--surface-page);padding:16px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:10px}.bar{background:var(--navy);height:10px}.lbl{font-size:11px;color:var(--text-secondary);width:110px;text-transform:uppercase;letter-spacing:var(--tracking-label)}</style>
<div class="row"><div class="lbl">space-2 / 8px</div><div class="bar" style="width:var(--space-2)"></div></div>
<div class="row"><div class="lbl">space-4 / 16px</div><div class="bar" style="width:var(--space-4)"></div></div>
<div class="row"><div class="lbl">space-8 / 32px</div><div class="bar" style="width:var(--space-8)"></div></div>
<div class="row"><div class="lbl">space-12 / 48px</div><div class="bar" style="width:var(--space-12)"></div></div>
<div class="row"><div class="lbl">space-20 / 80px</div><div class="bar" style="width:var(--space-20)"></div></div>
<div class="row"><div class="lbl">space-32 / 128px</div><div class="bar" style="width:var(--space-32)"></div></div>
