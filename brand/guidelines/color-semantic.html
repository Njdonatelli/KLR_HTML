<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Tokens" subtitle="Text, accent and status roles" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:16px 20px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-primary)}.dot{width:22px;height:22px;border-radius:50%;flex:none}</style>
<div class="grid">
<div class="chip"><div class="dot" style="background:var(--accent-primary)"></div>accent-primary (navy)</div>
<div class="chip"><div class="dot" style="background:var(--accent-secondary)"></div>accent-secondary (olive)</div>
<div class="chip"><div class="dot" style="background:var(--accent-tertiary)"></div>accent-tertiary (bronze)</div>
<div class="chip"><div class="dot" style="background:var(--accent-tan)"></div>accent-tan</div>
<div class="chip"><div class="dot" style="background:var(--text-secondary)"></div>text-secondary</div>
<div class="chip"><div class="dot" style="background:var(--success)"></div>success</div>
<div class="chip"><div class="dot" style="background:var(--warning)"></div>warning</div>
<div class="chip"><div class="dot" style="background:var(--danger)"></div>danger</div>
<div class="chip"><div class="dot" style="background:var(--border-strong)"></div>border-strong</div>
</div>
