<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Shadow" subtitle="Small radii, soft low-elevation shadows" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-label);background:var(--surface-page);padding:20px;box-sizing:border-box;display:flex;gap:18px;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-secondary)}.box{width:80px;height:70px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}</style>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)">sm</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-md)">md</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)">lg</div>
<div class="box" style="border-radius:var(--radius-pill);width:110px">pill</div>
